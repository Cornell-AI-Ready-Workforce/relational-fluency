name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agents-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agents service
        working-directory: agents
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: agents
        run: pytest

  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build app
        working-directory: app
        run: |
          npm install
          npm run build
