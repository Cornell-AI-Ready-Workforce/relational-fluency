name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agents-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install agents service
        working-directory: agents
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: agents
        run: pytest

  platform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install platform dependencies
        run: pip install -r requirements.txt
      # Imports the FastAPI app with no credentials present — catches syntax
      # errors, bad imports, and anything that reaches for a key at import time.
      - name: Import check
        run: python -c "import server.app; print('server.app imports OK')"
      - name: Validate scenario definitions
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = []
          files = sorted(glob.glob("scenarios/*.yaml"))
          for path in files:
              try:
                  if not isinstance(yaml.safe_load(open(path)), dict):
                      bad.append(f"{path}: not a mapping")
              except yaml.YAMLError as exc:
                  bad.append(f"{path}: {exc}")
          print(f"checked {len(files)} scenarios")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
