name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # WHY this is a matrix, and why it runs tests/ at all.
  #
  # This job used to be one cell: ubuntu-latest × Python 3.12, an import check
  # and some scenario validation. It never ran tests/ — 17 modules and 845 tests
  # covering the live path (the API, the voice runner, the client blockers). Whether the participant-facing suite was
  # green depended on who remembered to run it locally.
  #
  # The other half is the matrix. Participants are recruited from the public and
  # reach this study from Chrome, Firefox or Safari on macOS, Windows or Linux;
  # researchers run the server and the ops runbook on all three OSes. One cell
  # catches none of that. Concretely, what the extra legs are for:
  #
  #   * windows-latest — path handling and newline handling. The suite passes on
  #     Windows today (verified: 845 passed, Python 3.12.10); this is what keeps
  #     it that way rather than discovering a regression mid-wave.
  #   * macos-latest — where a BSD-vs-GNU host assumption shows up if one ever
  #     enters a test or a tool (the `sed -i ''` class of bug).
  #   * Python 3.13 — the first thing anywhere to execute the pure-Python
  #     `_ratecv`/`_rms` fallback in server/voice/realtime.py, which carries the
  #     participant microphone stream once PEP 594 removes `audioop`.
  #   * Python 3.11 — the declared floor (see requirements.txt). Untested floors
  #     are not floors.
  #
  # fail-fast is off: one red cell must not hide the state of the other eight.
  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Node is a real dependency of this job, so declare it instead of
      # inheriting it.
      #
      # Two test modules drive the participant pages through node
      # (tests/test_client_blockers.py, tests/test_browser_compat.py). Each calls shutil.which("node") and
      # pytest.skip()s when it is absent — the right behaviour on a
      # contributor's laptop, where node is not a runtime dependency of the
      # study, and the wrong behaviour here. Until this step existed the job
      # never installed node and passed only because the GitHub runner images
      # happen to ship one. The day an image stops shipping it, every Safari
      # -webkit guard and every MediaRecorder WebM/MP4 negotiation check
      # would skip and the build would stay
      # green: coverage disappearing without a sound, which is the failure mode
      # this suite exists to prevent (tests/conftest.py).
      #
      # Pinned rather than `latest` for the same reason the python matrix is
      # pinned: a harness that starts failing should be a change someone made,
      # not one that happened to them overnight.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `shell: bash` on every multi-line step. The default shell on
      # windows-latest is pwsh, whose wrapper only checks the exit code of the
      # *last* line, so a failing install in the middle of a block would pass
      # silently. GitHub ships bash on all three runners and runs it with
      # `set -eo pipefail`.
      - name: Install platform dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest is deliberately not in requirements.txt: that file is the
          # frozen production dependency set, and adding a test runner to it
          # would ship pytest inside every deployed container. A
          # requirements-dev.txt is the tidier home for this line.
          pip install pytest httpx2
      # Imports the FastAPI app with no credentials present — catches syntax
      # errors, bad imports, and anything that reaches for a key at import time.
      - name: Import check
        shell: bash
        run: python -c "import server.app; print('server.app imports OK')"
      # setup-node above declares node; this proves it reached the interpreter
      # that runs the tests. The harnesses locate node with shutil.which(), so
      # ask the same question the same way — a node that is installed but not on
      # the PATH this step sees is exactly as useless as one that is missing,
      # and would otherwise show up only as a quieter test run.
      - name: Node harnesses can find node
        shell: bash
        run: |
          python - <<'PY'
          import shutil, subprocess, sys
          node = shutil.which("node")
          if not node:
              sys.exit(
                  "node is not on PATH for python's shutil.which(), so "
                  "tests/test_client_blockers.py and tests/test_browser_compat.py "
                  "would skip their page harnesses and "
                  "this build would go green having tested less than it claims. "
                  "Check the actions/setup-node step above."
              )
          print(node, subprocess.run([node, "--version"], capture_output=True, text=True).stdout.strip())
          PY
      # The suite that guards participant-facing behaviour. No RF_FIXTURE is set
      # here, so the wave-backed guards skip by design (tests/conftest.py) rather
      # than failing on a path that exists only on one laptop.
      #
      # `-rs` lists every skip and its reason in the log a human reads; the
      # junit report is the same run in a form the step below can count, and it
      # is written even when pytest exits non-zero.
      #
      # `python -m pytest`, not bare `pytest`, and the difference is not
      # cosmetic. `server` is a top-level package imported off the repository
      # root and is never installed; `python -m` puts the invocation directory
      # on sys.path, whereas the console script puts its own bin directory there
      # instead. Written as `pytest tests`, this step raised
      # "ModuleNotFoundError: No module named 'server'" during collection on all
      # nine cells and ran zero tests — while the "Import check" step above
      # stayed green, because `python -c` does add the cwd. tests/conftest.py
      # now inserts the root itself so either form works; this is the second
      # lock on the same door, and it makes this step agree with how every
      # quoted baseline for this repository was actually produced.
      - name: Platform test suite
        shell: bash
        run: python -m pytest tests -q -rs --junitxml=platform-tests.xml
      # An error is not a failure, and telling them apart is the whole reason
      # this step exists.
      #
      # tests/test_app.py's `fakes` fixture used to hand-write a five-column
      # `sessions` table. The app's startup hook then ran the real
      # init_storage() against it, CREATE TABLE IF NOT EXISTS left the stub
      # alone, and the CREATE INDEX on sessions(participant_id) after it raised
      # — so 108 tests, the entire researcher API surface, errored
      # during setup on any machine without the private fixture wave. That is
      # every machine here. All nine cells were red for a reason everyone had
      # stopped reading, which is exactly how the next real regression gets
      # waved through: it arrives inside noise that is already being ignored.
      # pytest's exit code cannot say "108 tests never ran" any differently from
      # "one assertion failed", so say it here, separately, and name them.
      #
      # The second half is the skip roster, for the same reason in the opposite
      # direction: a skip is coverage that did not happen, and the only skips
      # this job is entitled to are the wave-backed ones. node comes from
      # setup-node and git from actions/checkout, so a skip mentioning either is
      # a harness that stopped running rather than a guard doing its job. An
      # unrecognised reason fails here on purpose — adding a pattern to ALLOWED
      # is then a sentence somebody writes deliberately, the same contract
      # EXPECTED_V3 carries in the scenario job below.
      #
      # It runs when the suite went red, because the split between "errored at
      # setup" and "genuinely failed" is needed most exactly then; not when the
      # job was cancelled, which should read as cancelled rather than as a
      # missing report. A missing report is otherwise a claim this step cannot
      # make, so it says so and fails rather than passing on an absence.
      - name: No test errored, and every skip says why
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python - <<'PY'
          import collections, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          # Skip reasons and assertion messages in this suite are written
          # with em dashes. On windows-latest python's default stdout
          # encoding is the ANSI codepage, and one of those characters
          # would end this step in a UnicodeEncodeError instead of a
          # report, on the one runner most likely to be reporting a real
          # path problem.
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          sys.stderr.reconfigure(encoding="utf-8", errors="replace")

          # Substring, lowercased. Each line is a category of skip this job
          # expects to see; anything else stops the build.
          ALLOWED = (
              "recorded wave",      # tests/conftest.py NO_WAVE_REASON, and the
              "the wave",           # guards that word their own version of it
              "this wave",
              "session index at",
              "rf_fixture",
              # A parametrisation whose only source of cases is the wave.
              # pytest's own wording, and it should grow a stated reason.
              "empty parameter set",
              # A red-before guard that has outlived its own defect. These
              # compare the shipped page against the one in HEAD and exist to
              # prove a fix was needed; once that fix IS HEAD there is no
              # before left to fail, and the honest report is a skip saying so
              # rather than a pass asserting nothing. They retire themselves the
              # moment their commit lands, which is why this job sees them on a
              # committed tree and not in the working copy that wrote them.
              "there is no before left to fail",
          )

          report = Path("platform-tests.xml")
          if not report.is_file():
              sys.exit("platform-tests.xml was never written: pytest did not run "
                       "to completion, so nothing here can be certified.")

          root = ET.parse(report).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total = int(suite.get("tests", 0))
          n_err = int(suite.get("errors", 0))
          n_fail = int(suite.get("failures", 0))
          n_skip = int(suite.get("skipped", 0))
          print(f"{total} collected: {total - n_err - n_fail - n_skip} ran clean, "
                f"{n_fail} failed, {n_err} errored, {n_skip} skipped")

          errored, skips = [], collections.Counter()
          for case in suite.iter("testcase"):
              err = case.find("error")
              if err is not None:
                  first = (err.get("message") or "").strip().splitlines()
                  errored.append(f"{case.get('classname')}::{case.get('name')}"
                                 f"  {first[0] if first else 'no message'}")
              skipped = case.find("skipped")
              if skipped is not None:
                  # Keyed on the whole reason and truncated only for the
                  # printout: a wave guard whose wording explains itself at
                  # length would otherwise be judged on its first 120
                  # characters and fail this step for being verbose.
                  skips[" ".join((skipped.get("message") or "").split())] += 1

          print("\nskipped, by reason:")
          for reason, count in skips.most_common():
              print(f"  {count:>4}  {(reason or '(no reason given)')[:120]}")

          bad = []
          if errored:
              bad.append(f"{len(errored)} test(s) errored rather than ran:")
              bad.extend(f"    {line}" for line in errored[:25])
              if len(errored) > 25:
                  bad.append(f"    ... and {len(errored) - 25} more")
              bad.append("  An error is a test that never got to run. Fix the "
                         "setup, do not read past it.")
          unknown = [r for r in skips if not any(p in r.lower() for p in ALLOWED)]
          if unknown:
              bad.append("skipped for a reason this job does not expect:")
              bad.extend(f"    {skips[r]:>4}  {(r or '(no reason given)')[:120]}"
                         for r in unknown)
              bad.append("  Either it should run on a CI runner (node, git and "
                         "every pinned dependency are here), or its wording "
                         "belongs in ALLOWED above, added deliberately.")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY

  # Instrument integrity. Not platform-specific, so one cell is the right amount
  # of CI: these steps read scenario YAML and regenerate a markdown table. The
  # scenario-map step in particular is a byte-for-byte `git diff`, and running it
  # on three OSes would compare working trees whose line endings differ by
  # checkout (see .gitattributes) rather than by content.
  scenario-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install platform dependencies
        run: pip install -r requirements.txt
      # "Does it parse to a mapping" is much weaker than what the loaders need,
      # and the gap is silent by design: scenarios_v3._spec_files() drops any
      # spec missing a required key, list_scenarios() swallows a compile
      # failure, and _spec_files() is a dict keyed on `id`, so two specs sharing
      # an id collapse into one with no error anywhere. A broken study spec
      # therefore does not crash — it disappears from the participant-facing
      # list and from run assignment while CI stays green. So run the real
      # loaders and assert the exact set of ids that must come out of them.
      - name: Validate scenario definitions
        run: |
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          from server import scenarios, scenarios_v3

          # The eight study forms: two per construct. This literal is the
          # contract: if a spec stops loading, or a new one is added, CI fails
          # until someone updates this line deliberately. A study scenario must
          # never vanish quietly. (The C forms were retired in 2026-09 for
          # Study 1 — docs/study1-plan.md — and deleted here in the same commit.)
          EXPECTED_V3 = {"S1A", "S1B", "S2A", "S2B", "S3A", "S3B", "S4A", "S4B"}

          bad = []

          # Pass 1: read every spec the way the loaders do — with an explicit
          # encoding (a UTF-8 spec decodes wrongly under a non-UTF-8 default
          # locale) and a closed handle — and catch every failure, not only
          # YAMLError: an OSError or UnicodeDecodeError should be reported, not
          # crash the step with a traceback.
          seen = {}
          files = sorted(Path("scenarios/v3").glob("*.yaml"))
          for path in files:
              try:
                  with path.open(encoding="utf-8") as fh:
                      data = yaml.safe_load(fh)
              except Exception as exc:
                  bad.append(f"{path}: unreadable: {exc}")
                  continue
              if not isinstance(data, dict):
                  bad.append(f"{path}: not a mapping")
                  continue
              # Neither loader raises on a file missing one of these: it skips
              # the file (list_scenarios() at its `continue`, _spec_files() via
              # _REQUIRED_KEYS), so the scenario just stops being offered. That
              # silent drop is what this step exists to catch, so assert them.
              for key in ("id", "title"):
                  if not data.get(key):
                      bad.append(f"{path}: missing required key {key!r}")
              sid = data.get("id")
              if sid in seen:
                  bad.append(f"{path}: duplicate id {sid!r}, already used by {seen[sid]}")
              elif sid:
                  seen[sid] = path.name

          # Pass 2: the v3 bank must load AND compile — compile_scenario is what
          # a run assignment and the voice runner actually call.
          got = set(scenarios_v3.available())
          if got != EXPECTED_V3:
              bad.append(f"v3 bank loaded {sorted(got)}, expected {sorted(EXPECTED_V3)}")
          for sid in sorted(got):
              try:
                  scenarios_v3.compile_scenario(sid)
              except Exception as exc:
                  bad.append(f"{sid}: loads but does not compile: {exc}")

          # Pass 3: everything the listing offers must still load, since that
          # listing is what the participant page and /api/scenarios serve.
          listed = scenarios.list_scenarios()
          for row in listed:
              if row["id"] in EXPECTED_V3:
                  continue
              try:
                  scenarios.load_scenario(row["id"])
              except Exception as exc:
                  bad.append(f"{row['id']}: listed but does not load: {exc}")
          absent = EXPECTED_V3 - {row["id"] for row in listed}
          if absent:
              bad.append(f"study scenarios missing from list_scenarios(): {sorted(absent)}")

          print(f"checked {len(files)} scenario files; {len(listed)} offered by list_scenarios()")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
      # docs/scenario-map.md is the table researchers read to see which triggers
      # fire and which ESCI items each one scores. It is generated, and until
      # now nothing noticed when a spec changed and it was not regenerated: it
      # spent this branch describing an S2 with four triggers while the specs
      # planted six. A wrong map is worse than no map, because it is read as the
      # instrument. The generator is a pure function of scenarios/v3/*.yaml, so
      # re-running it and diffing is the whole check.
      - name: Scenario map is up to date
        run: |
          python tools/gen_scenario_map.py
          git diff --exit-code -- docs/scenario-map.md \
            || { echo "docs/scenario-map.md is stale — run python tools/gen_scenario_map.py and commit the result." >&2; exit 1; }
