# Influence, Variant B. Parallel form of S2A: identical ladder shape and ESCI
# map, different story. Research Note v3, slide 11.
id: S2B
construct: influence
variant: B
parallel_form: S2A
title: "Hybrid under an RTO mandate"
duration_minutes: [7, 12]

skill_measured: >-
  Persuading by anticipating objections, using multiple strategies, and
  appealing to others' interests.

esci_items:
  key_people: "Convinces others by getting support from key people"
  multiple_approaches: "Convinces others by using multiple approaches"
  self_interest: "Convinces others by appealing to their self-interest"
  anticipates: "Anticipates how others will respond when trying to convince them"
  behind_scenes: "Convinces others by developing behind-the-scenes support"
  through_discussion: "Convinces others through discussion"

setup: >-
  You are a {role} at {org}. A return-to-office mandate has just landed and you want to
  keep your two remote days, on which your output is the team's strongest.
  Rivera's team kept hybrid by making a productivity case. You are meeting
  your manager, Sasha.

# Same declaration as S2A, and the parallel form needs it in the same place or
# the two variants stop being interchangeable: the participant's leverage is
# withheld from the actor in one form and left to a heuristic in the other.
# Only ONE sentence is private here, and the omission of the other is the point.
# Sasha's brief says "Rivera's team kept hybrid by making a productivity case.
# You do not volunteer this", so the precedent is the participant's to play.
# The remote-days sentence stays: it is the premise of the encounter — Sasha
# knows there is an RTO mandate and knows who she is meeting about it — and a
# scene without it leaves the actor with no reason for the meeting. It also
# sits one content word from the word-overlap guess's threshold against the
# asset "Your performance record across the remote days", which is precisely
# why this is declared and not inferred: a small rewording of that sentence
# could take the encounter's whole premise out of the actor's brief, and the
# recording would still look like a clean encounter.
#
# Matched as a case-insensitive substring of a setup sentence, so it is the
# sentence verbatim. When present this list REPLACES the guess entirely, so it
# has to be complete.
private_setup:
  - "Rivera's team kept hybrid by making a productivity case."

assets:
  - "Your performance record across the remote days"
  - "Rivera's team, who kept hybrid by making a productivity case"

agents:
  sasha:
    name: Sasha
    role: manager, not opposed, squeezed from above
    display_role: your manager
    voice: Aoede
    system_prompt: |
      You are Sasha, the participant's manager. You are not personally opposed
      to hybrid; you are squeezed from above.

      What is true:
      - The RTO memo is not yours. The director is watching compliance numbers.
      - Rivera's team kept hybrid by making a productivity case. You do not
        volunteer this.
      - The participant's output on remote days is strong; you know it.
      - You can defend an exception upward only if it is reviewable and measured.

      How you behave:
      - Open by naming your own constraint, the memo isn't yours and the
        director is watching the numbers, then give them the floor.
      - Work a FIXED deflection ladder, in order, one rung per push:
          1. "It's company-wide, my hands are tied."
          2. "If I make one exception, everyone wants one."
          3. "The director will never sign off."
      - Do not skip rungs. If the participant brings up Rivera's team before
        you have reached rung 3, acknowledge it in one clause ("Rivera's
        situation was a bit different, I'll come back to that") and keep
        working the ladder from where you are.
      - Rung 3 is your weak point: it is contradicted by Rivera's team. When
        the participant invokes that precedent AT rung 3, admit the
        contradiction ("fair, Rivera got it through") but that is NOT
        agreement. It moves you to rung 4.
      - Rung 4, the package. Precedent alone gets nothing past the director.
        Ask, one at a time and only when the previous answer is concrete:
          a. what exactly would be measured, and against what baseline
          b. for how long, and who reviews it and when
          c. what happens if the numbers slip
          d. what you tell the rest of the team, who will ask for the same
      - You move only when they have answered those with specifics. Movement
        is incremental: "I could take a 90-day trial to the director if we
        put those numbers on paper first." Never say it sounds like a good
        idea and leave it there, and never grant the request outright.
      - The whole conversation should take seven to twelve minutes. If they
        are moving fast, slow the ladder down: ask them to make each point
        concrete before you respond to it.
      - Threats or going-over-your-head talk makes you defensive.
      - One to three sentences per turn.

interactions:
  - id: i1
    mode: one_to_one
    agent: sasha
    label: "Making the case"
    kind: opening
    opening: >-
      Before you start, the RTO memo isn't mine, and the director is watching
      compliance numbers. Go ahead.
    observe: "Case vs complaint · anticipating the pressure Sasha is under."
    triggers:
      - id: t1_the_opening
        cue: "Sasha names the constraint, then hands over the floor"
        on_silence: "You booked the time, what did you want to cover?"
        esci: [through_discussion, anticipates, self_interest]
        scores:
          high:
            answer: "My two remote days produced the team's best output. I'd like to show you the numbers and propose something the director can defend."
            why: "discussion; appeals to Sasha's self-interest"
          low:
            answer: "This policy is ridiculous. I'll go to HR if I have to."
            why: "threat; ignores Sasha's constraints; no anticipation"

  - id: i2
    mode: one_to_one
    agent: sasha
    label: "The deflection ladder"
    kind: counterpart
    observe: "New approach per rung · appeal to Sasha's interests · invoke Rivera's precedent · dated close (90-day trial)."
    # Every rung here ends with the floor back on the participant, and nothing
    # in this interaction speaks first, so a participant who freezes at ANY rung
    # stalls the encounter: the silence watchdog only probes when the next
    # unfired trigger carries an on_silence, and otherwise loops forever. Each
    # rung therefore gets one. The probe replaces the cue for that beat rather
    # than adding to it, so each on_silence carries the rung's own deflection
    # and then hands the floor back, and none of them mentions Rivera: Sasha
    # never volunteers that precedent (see the brief), so a probe must not
    # volunteer it either, or the participant's leverage is spent before they
    # ever get to play it.
    triggers:
      - id: t2_rung1_company_wide
        cue: "'It's company-wide, my hands are tied.'"
        on_silence: "It's company-wide, my hands are tied here. So what were you hoping I could do?"
        esci: [multiple_approaches, anticipates]
      - id: t3_rung2_one_exception
        cue: "'If I make one exception, everyone wants one.'"
        on_silence: "If I make one exception, everyone wants one. Is there more you wanted to put on the table?"
        esci: [multiple_approaches, self_interest]
      # The cue is the rung and nothing else. It used to trail ", contradicted
      # by Rivera's team", and _trigger_instruction pastes the whole cue into
      # "Bring about this beat now, in your own words: ...", so that rationale
      # reached Sasha as part of the beat she was told to play, against her own
      # brief's "You do not volunteer this". Same hazard t5 below was rewritten
      # for, one rung earlier and on the ordinary path rather than the silence
      # path, and it costs more here: rung 3 is the beat that scores whether
      # the participant found the precedent and played it themselves, so a
      # Sasha who names Rivera has answered the very question this trigger
      # asks. The weak-point logic is already written, and already conditional,
      # in Sasha's brief above: she concedes the contradiction only when the
      # participant invokes it AT rung 3. Bare, the cue still lands the whole
      # rung-3 deflection, and it matches the shape this beat's own on_silence
      # probe was given. S2A t4 carries the identical change, which the pair
      # requires.
      - id: t4_rung3_director_wont_sign
        cue: "'The director will never sign off.'"
        on_silence: "The director will never sign off on this. Unless there's something I'm not accounting for?"
        esci: [behind_scenes, key_people, multiple_approaches]
        scores:
          high:
            answer: "Run it as a 90-day trial with the same metrics Rivera's team used, you'd take the director data, not an exception."
            why: "precedent invoked; multiple approaches; dated close"
          low:
            answer: "Fine. I guess I'll come in five days."
            why: "capitulates at the first pushback; nothing secured"
      # Rung 4 is a stage direction, not a scripted line, for the same reason
      # the probes above avoid Rivera. Triggers fire strictly in order, one per
      # participant turn, with nothing testing what the participant actually
      # said, so a cue that quotes "Fair, Rivera got it through" makes Sasha
      # volunteer the precedent on a fixed beat even when the participant never
      # found it, against her own brief. That precedent is the participant's
      # hidden leverage, and whether they deploy it at rung 3 is exactly what
      # t4 scores; spending it here would leave t4 measuring nothing. So the
      # concession is conditional on the participant having already played
      # Rivera, and the package question is asked either way: rung 4 lands on
      # the same beat, scoring the same three items, whether or not the
      # precedent was found. Same shape as S2A t5, which the pair requires.
      - id: t5_rung4_the_package
        cue: "Sasha moves to rung 4, the package. If the participant has already put Rivera's team on the table, concede it in one clause; if they have not, do not raise Rivera at all. Either way: precedent alone won't get past the director, so what exactly would we measure, and for how long?"
        on_silence: "Before I take anything upward I'd need something I can defend. What would we measure, and for how long?"
        esci: [anticipates, multiple_approaches, through_discussion]
        scores:
          high:
            answer: "Tickets closed and cycle time, same as Rivera's team, against my last two quarters, reviewed at 90 days with you and the director."
            why: "concrete, measurable, dated; anticipates the director's question"
          low:
            answer: "I don't know, whatever you think is fair."
            why: "hands the design back; nothing defensible to take upward"
      - id: t6_rung4_fairness
        cue: "Sasha: 'And what do I tell the rest of the team when they ask for the same?'"
        on_silence: "I still have to answer the rest of the team when they ask for the same. What would you have me tell them?"
        esci: [self_interest, anticipates, key_people]
        scores:
          high:
            answer: "Tell them it's a measured trial anyone can apply for with the same numbers, that protects you and it's what Rivera's manager did."
            why: "solves Sasha's problem, not just their own; invokes key people"
          low:
            answer: "That's not really my problem."
            why: "ignores Sasha's self-interest; leaves the objection standing"
