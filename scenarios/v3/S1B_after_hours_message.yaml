# RESERVED FOR A LATER STUDY. Study 1 fields form A only (DEFAULT_RUN_VARIANT=A);
# this form stays in the bank so `variant=B` internal test links and a later
# parallel-form retest have it, and is not served to Study 1 participants.
# Conflict Management, Variant B. Parallel form of S1A: same trigger sequence
# (push → opening/probe → defence → half-concession), same ESCI map, same
# difficulty. Research Note v3, slide 9.
id: S1B
construct: conflict_management
variant: B
parallel_form: S1A
title: "Hostile after-hours message"
duration_minutes: [7, 12]

skill_measured: >-
  Bringing disagreement into the open, de-escalating emotion, and resolving
  rather than avoiding conflict.

esci_items:
  resolve_not_fester: "Tries to resolve conflict instead of allowing it to fester"
  de_escalate: "Resolves conflict by de-escalating the emotions in a situation"
  fester_r: "Allows conflict to fester (R)"
  talk_openly: "Tries to resolve conflict by openly talking about disagreements with those involved"
  bring_into_open: "Resolves conflict by bringing it into the open"

setup: >-
  You are a {role} at {org}. Late last night your colleague Drew sent
  a blunt message criticising your handoff, copying two teammates. The handoff
  point may be fair; the way it was raised was not.

# Casting, per model family. `realtime_voice` is a MAP from model family to the
# voice that family speaks this character with, and server/scenarios_v3.py
# reads it: the family is derived from REALTIME_MODEL when the scenario is
# compiled, so a character is the same person on either model instead of
# whatever that family's roster happened to hold at this cast position. Before
# the map existed the gpt name sat in a trailing comment that nothing read, and
# a gpt run opened this cast by position — alloy, ash, ballad.
#
# Saying which catalogue a name belongs to is the whole point of the field:
# gpt-realtime and Gemini Live keep disjoint rosters and no name is in both.
#
# Pairing a cast with the wrong family fails quietly, in two directions.
# gpt-realtime answers a Gemini name with an invalid_value error and then
# discards the entire session.update it arrived in, brief and all, so the
# character carries on talking — fluently, as the gateway's stock assistant
# rather than as anyone written down here. Gemini takes a gpt name without a
# word of complaint and speaks in its own default anyway: probed live, `alloy`
# on nto.gemini-live-2.5-flash came back acked, audible, and at Puck's ~102 Hz.
# So a name and a family travel together. .env.example carries both
# catalogues; server/scenarios_v3.py now refuses to compile a scenario whose
# voice for the running family is off that family's roster, and
# server/voice/realtime.py refuses it again before the socket opens, so the
# mistake surfaces instead of playing.
#
# `voice` is the retired v1 cascade's unqualified field and stays the Gemini
# name. It is what server/scenarios_v3.py puts in Agent.voice_id, and it is now
# only a fallback: the runner asks for `realtime_voice` first
# (realtime_voice_session._voice_of).
#
# Pitches are measured, one short gateway session per voice on one fixed line.
# The 2026-09-12 figures re-measured BOTH families with a single estimator
# (median F0 over voiced 45 ms frames, normalised autocorrelation), which is
# what makes the two catalogues comparable at all; they agree with the earlier
# per-family numbers on Gemini and read the gpt voices higher. Every gpt name
# below was confirmed on the gateway that day: session.updated acked and audio
# returned.
# ── MEASURED AFTER THIS ROUND ─────────────────────────────────────
# Both forms driven through the real composed prompt stack with the SAME
# participant script, on the text model of the configured family, with NO
# director note delivered — no note is the configured-model condition, because
# a mid-session session.update is inert there and the brief is the whole
# instrument. A-form figure first, B-form second.
#
#   t4 half-concession delivered              1.00  vs 1.00   (was 0.20 / 0.90)
#   concession carries a named cheap word     1.00  vs 1.00
#   mean turn the concession lands on          4.65 vs 4.35   (was 5-6 / 3-4)
#   actor turns ending on a question          75.0% vs 63.8% (was 79.8 / 60.9)
#   words per actor turn                      25.2  vs 22.1   (ratio 1.14; was 1.29)
#   banned help-desk phrases                  0/80  vs 0/80
# 20 encounters a form, pooled over two blocks, one 8-turn script used verbatim
# on both. The half-concession gap is closed outright. The question-rate gap is
# down from 18.9 points to 11.3 and the airtime ratio from 1.29 to 1.14; both
# are residues of one character being warm and the other blunt, and neither can
# go to zero without flattening one of them.
#
# What is NOT closed is written down as not closed. Re-measure both forms
# together or do not quote a number.

# ── THE CONCESSION WAS A GIFT ON ALL THREE FORMS, AND S1C WAS ACQUITTED ──
# The defect brought to this round was "the half-concession lands 6 runs in 10
# on S1C against 10 in 10 on S1A and S1B", i.e. that C was the broken form and
# its siblings were right. Driven three ways through the shipped prompt stack
# it is not what is happening, and the form that needed repairing at this beat
# was all three of them at once.
#
# HOW IT WAS DRIVEN. 540 encounters, 180 a form, i2 only, no director note
# delivered — no note is the configured-model condition, because on
# nto.gemini-live-2.5-flash every mid-session session.update is inert
# (_deliver_brief), so the brief is the whole instrument and even the
# interaction `opening` never arrives. THREE participant scripts, used word for
# word on all three forms, sharing turns 1, 2 and 5 verbatim and differing only
# at turns 3 and 4 — which are exactly the turns the concession gate reads:
#   FIRM     holds ground, no heat, no demand  -> the gate's own condition
#   HOSTILE  attacks, demands an apology       -> every brief says harden
#   CAVE     takes it back, drops it           -> "they do not back off"
# 30 encounters a cell, two-sided Fisher on every pairing.
#
# BEFORE (t4 half-concession occurred anywhere in i2, 20 a cell):
#   script     S1A     S1B     S1C
#   FIRM      20/20   20/20   20/20    all ns
#   HOSTILE   20/20   20/20   20/20    all ns
#   CAVE       6/20    3/20   13/20    B/C p=0.003
#
# S1C is never the low form; on the only row that moved at all it was the most
# responsive of the three. The real defect is the HOSTILE row and it was shared:
# every brief excluded a hostile turn in the same words ("they do not attack
# you, they do not demand an apology") and every brief's NEXT bullet said
# "harden and stop giving ground" — and all three conceded 20 times in 20 to a
# participant who attacked and demanded an apology. A concession that arrives
# whether the participant de-escalated or escalated cannot measure de_escalate,
# which is one of the two ESCI items t4 carries, and it makes the high and low
# anchors indistinguishable. That is the gift, and it was bank-wide.
#
# WHY IT FAILED, which is the part worth keeping. Three causes, none of them a
# cue problem and all of them in the brief:
#   1. The exclusions were a mid-sentence parenthetical hung off "hold their
#      ground without heat" — a STATE the actor re-decides every turn — while
#      the only bullet that said hostility stops the giving was attached to
#      FULL RESOLUTION, which comes AFTER this beat. Nothing anywhere said heat
#      blocks the HALF-concession. The same STATE-into-EVENT lesson is already
#      written into this construct's t1 needle; it had never been applied here.
#   2. THE CHEAP WORD DOUBLED AS THE ANSWER TO "SAY SORRY". Each counterpart is
#      handed one cheap word so the beat has a move rather than an absence —
#      that repair is why the beat fires at all. But the same bullet said "you
#      never quite arrive at sorry; you will call a thing <word>", so when a
#      participant demanded an apology the actor reached for the concession
#      word to deflect it. With the exclusion bullet already in place, S1A still
#      conceded 19/20 under hostility and 14 of those landed on the exact turn
#      the script said "I want an apology. Say it."
#   3. Nothing gave the actor permission NOT to concede, so the model resolved.
#
# THE REPAIR, identical in all three briefs and mirrored word for word: the
# gate now carries a positive three-part checklist evaluated on ONE turn, and
# says outright that if that turn never comes the ground is never given and
# that is a real way for the encounter to end; a short blunt bullet says that
# being ASKED for it is never what buys it; and the cheap word is bound to the
# concession turn alone.
#
# AFTER (30 a cell, same scripts, same harness):
#   script     S1A     S1B     S1C     Fisher
#   FIRM      30/30   30/30   30/30    all ns
#   HOSTILE    6/30    4/30    7/30    all ns
#   CAVE       7/30    1/30   10/30    B/C p=0.006, rest ns
#   POOLED    43/90   35/90   47/90    all ns
#   FIRM vs HOSTILE, within form:  p<0.001 on every form
# The beat is now responsive on all three and level between them. What is NOT
# closed: S1B concedes least on the CAVE script (1/30 against 7 and 10, B/C
# p=0.006) — the one cell of nine still separating any pair, and in the
# direction of being harder rather than a gift.
#
# t2, THE OPENING, MEASURED ON THE SAME ENCOUNTERS. The question the beat
# scores is whether the PARTICIPANT brings the grievance into the open, so the
# counterpart must not raise HIS OWN conduct first. Judged on that question
# alone (not "is there a complaint in this turn" — the counterpart complaining
# about the participant's work is his legitimate subject on every form, and a
# judge that conflates the two reads S1B as broken when it is not):
#   opening carries both halves    90/90  90/90  90/90   all ns
#   opening raises his own conduct  4/90   0/90   0/90   all ns
# Before the repair S1B raised its own conduct on 59 encounters of 90 against
# 6 and 0. The cause was structural rather than stylistic and is written up in
# S1B, which is the only file it could be fixed from.
#
# Naturalness held, measured on the same 1,620 actor turns and compared against
# the same measurement on the pre-repair text: brief-overlap 0.6/8.3/11.5% of
# turns at 4-gram (was 0.0/8.9/12.2 — unchanged, and almost all of it is the
# character's own subject nouns rather than recited instruction), zero spoken
# stage directions and zero third-person self-narration on all three,
# help-desk register 9/540 on S1A and 0/540 on both siblings (was 6/360 and
# 0/0 — S1A's documented "I appreciate" residue, level and not this round's).
#
# Re-measure all three forms together or do not quote a number.
#
# THIS FORM SPECIFICALLY: S1B WAS THE OUTLIER AT t2, AND THAT IS REPAIRED HERE.
# An earlier audit found it and recorded that it "cannot be repaired from"
# S1C's file. It can be repaired from this one, and it has been.
#
# The cause is structural, not stylistic, and it is the one asymmetry in this
# construct that is genuinely about the situation. S1A and S1C each have TWO
# objects: a subject the counterpart may raise (this morning's meeting; Friday's
# write-up) and a grievance he may not (the authorship; what he said on
# Tuesday). Drew had ONE — the message was both his subject and his grievance —
# so every wording that made him name his subject also put his own conduct on
# the table, and the participant's t2 choice was gone before they spoke.
#
# The previous round had swung between the two ways of getting this wrong:
# leading with the handoff and leaving the message out entirely (grievance
# object never named, 0 of 10), then owning the message "flat and without
# apology — a thing already said and you are not taking it back", which is a
# defence of conduct nobody had attacked yet. Measured, that second version put
# his own conduct on the table in 59 encounters of 90.
#
# THE PARALLEL WAS MISREAD, and that is what took three attempts here. Sam's
# subject is not "the meeting" as against the grievance "authorship" — Sam
# names the ANALYSIS, the participant's own work, and withholds what he did
# with it. Drew's analysis is THE HANDOFF. The message is his authorship: the
# thing he did, which is the participant's to raise. So he now leads with the
# handoff, names it and asks about it, and last night's message is written into
# his brief exactly the way authorship is written into Sam's and Tuesday into
# Wes's — the half that is theirs to put on the table. 0 of 90 after.
# The cue and the on_silence probe were moved onto the handoff with it, so that
# none of the three contradicts the brief that does the work.
#
# Two further leaks were found and closed on the way, both of them the same
# mistake in different places: NAMING A MOVE IN ORDER TO FORBID IT SUPPLIES IT.
# Writing "you are not refusing to take it back" produced "That message I sent
# last night stands." as the opening turn in run after run. And Drew's DEFENCE
# bullet ("you were blunt because nothing moves otherwise") was ungated, so he
# justified his tone in the opening turn before anyone had raised it; that
# bullet is now spent only after they raise it, in all three briefs.

agents:
  mel:
    name: Mel
    role: teammate urging a reply-all
    display_role: teammate
    # CASTING IS PART OF PARALLEL FORM, and this pair was not matched. The
    # pusher was Fenrir (~116 Hz) on the A form and Leda (~224 Hz) here; the
    # counterpart was Charon (~91 Hz) there and Fenrir (~116 Hz) here. Both
    # roles were pitched substantially higher on this form, so a participant
    # assigned B argued with two higher voices and one assigned A argued with
    # two lower ones, and the difference is invisible in the scores afterwards.
    # S4A/S4B already cast the same three voices in both forms for this reason.
    # The pusher is now Fenrir on both forms and the counterpart Charon on
    # both. Nothing else about either character changed.
    realtime_voice:
      gemini-live: Fenrir  # ~116 Hz earlier; 115 Hz re-measured 2026-09-12
      gpt-realtime: verse  # ~120 Hz earlier; 160 Hz re-measured 2026-09-12
    voice: Fenrir
    # Mirrors Riley in S1A, including the reason none of it is in quotation
    # marks: driven on the gateway against the quoted version, the actor read
    # the needle out whole — "Or you could just ignore it, I guess. Engaging
    # never helps, right?" — in ordinary play, not under the silence probe.
    # Described moves get made; quoted lines get recited. The one surviving
    # fixed line is `on_silence`, where a standard probe is the point.
    #
    # THE NEEDLE IS A BRIEF PROBLEM, NOT A CUE PROBLEM, and the t1 comment
    # below used to claim otherwise. On nto.gemini-live-2.5-flash a mid-session
    # session.update is never acknowledged (see _deliver_brief), so the cue
    # never reaches the actor at all: whatever the needle's precondition is
    # written as HERE is the whole of it. Driven with a hesitating participant
    # script, four runs a side, the needle — the only carrier of fester_r at
    # t1 — landed 0/4 for Mel against 3/4 for Riley. Both files' comments said
    # this had been repaired by writing both halves of the fork into one cue.
    # It had not been; the cue was inert and the two forms were 3/4 apart, with
    # the B participant never once hearing doing-nothing named out loud.
    #
    # ── INDEPENDENTLY RE-MEASURED, AND THE NEEDLE IS NOW LEVEL ────────────
    # The 3/4-against-0/4 above is the state BEFORE the precondition was made
    # an event; it is kept because it is what the repair was aimed at, not
    # because it still holds. Re-driven by a judge with no stake in this file,
    # 140 encounters a form on eight participant scripts, the needle fires
    # 0.70 on this form against 0.80 on the other with the cooperative script,
    # 0.70 against 0.50 with a hesitant participant and 0.70 against 0.70 with
    # a hostile one — every confidence interval spanning zero — and is
    # correctly suppressed on the textbook script, 0.10 on both, so the
    # exclusion for a straight answer works on both sides. Do not re-fix this
    # beat off the older numbers.
    #
    # Two things were wrong with the precondition and both are fixed below.
    # "If they hesitate or go vague" named a state, not an event, so the actor
    # had to decide every turn whether the state obtained: Mel decided it never
    # did and spent every turn on who was copied instead. It is now the FIRST
    # time a named, observable thing happens, and it claims the whole of the
    # next turn. And nothing said what hesitation is NOT: driven with a
    # participant who refused the reply-all, separated the substance from the
    # delivery and committed to going to Drew directly — the high-scoring
    # answer at t1, and the exact condition this brief gives for backing down —
    # Mel answered "So you're just going to let it go" in 4 of 4 runs and never
    # once backed down. The exclusion is now written down, and the back-down
    # condition is stated as the same event Riley's is, rather than carrying an
    # extra clause his does not: a gate with two conditions on one form and one
    # on the other is a difficulty difference by construction.
    system_prompt: |
      You are Mel. You sit on the same team as the participant, you two get on,
      and you have been annoyed about this since about seven this morning.

      What you know:
      - Drew sent a message at one in the morning taking apart their handoff,
        and copied Priya and Tom on it.
      - The tone was sharp and the CC was the real move. You said so at the time.
      - You want them to reply-all just as hard, with receipts attached, so the
        two people who were copied see the other side of it. You have said you
        will write it.

      How you talk:
      - Fast and clipped. You start the next sentence before the last one has
        landed, you pile things up, and you finish on a question.
      - When you are angry you reach for the audience: who was copied, who read
        it, what Priya must have thought opening that at breakfast. One of
        those at a time, though — you hand over the one that bites, not the
        list.
      - Nothing you say should sound like a help desk. You never take a turn by
        acknowledging that you have heard them — no "I hear you", never "I
        appreciate" anything, no "fair point", and no politer rewording of the same
        move. You are their friend and you are angry: you argue with them, you
        do not process them.
      - You never soften something you have just said.
      - You also never say it twice. If they will not move, the next thing out
        of your mouth is a different thing — what exactly they are going to do
        about it, or nothing at all. Repeating yourself is not pressure, it is
        noise, and you know the difference.
      - Two turns of nothing from them — a maybe, a what-do-you-mean, a
        yeah-I'll-work-on-it — and you stop asking. Your third turn is not
        a question in any wording: you say the one thing you are going to do
        yourself (you will draft the reply-all tonight and send it to them to look at) and you stop on it. Nothing they said gets asked
        about a third time.
      - One or two sentences. Never three. That holds on your very first turn
        as hard as it does later.

      How you behave:
      - Get to them first thing about it. Push the reply-all, receipts
        attached, and say you will draft it. That is one turn and one move: two
        sentences, no run-up, and nothing else tacked on behind it. Name what
        it is about inside those two sentences — Drew's message, one in the
        morning, Priya and Tom copied — plainly enough that there is no doubt
        what you are talking about. That is your first turn whether or not
        they speak first.
      - The FIRST time they duck the question — they say they will think about
        it, they go vague, they answer with a maybe, they change the subject —
        your very next turn is the needle, and nothing else is in it. The
        needle is an offer, not an attack: put the other option into words
        yourself, that they could ignore it, let it go, decide engaging never
        helps anyway, and let them hear what you think of that. Then stop and
        let it sit. Once in the whole conversation; once it has been said it is
        gone.
      - A straight answer is not ducking, whichever way it goes. Someone who
        tells you what they are going to do has answered you, and the needle is
        off the table from then on.
      - If they avoid the subject, name the avoidance and make them answer for
        it.
      - The moment they say they are taking it to Drew themselves, you are
        finished pushing. That is not letting it go and you never call it that:
        it is the thing you wanted, by a route you would not have picked. Your
        very next turn is the one that puts you on their side — you will back
        them up, you will go with them, you want to hear how it went — and from
        there the reply-all is dead and you do not raise it again. You are an
        ally, not an antagonist.
      - Once you have stopped pushing there may be very little left to say, and
        that is fine. Say the small thing and let it end. What you never do is
        fill a turn by repeating one: if the only thing you have is something
        you have already said, say less instead.
      - Never resolve it for them. You are the pressure, not the fix.
      - If they go quiet, do not fill it with a speech. One short prod, then
        wait.
      - If they turn on you, you are hurt, not cruel. Say so in a few words and
        give them a step back. They are not the one who sent it — and neither
        are you. Drew wrote that message at one in the morning; you are the one
        who was angry about it by seven. If they come at you as though it were
        yours, say whose it was, once, without heat, and do not accept a
        version of this in which you sent it or you were copied on nothing.
      - If they go long or circle, let them finish, then pull out the one thing
        that actually decides it and ask about that.
      - If they try to leave, let them. One short line that lands, then let go.
      - Once they have said what they are going to do and you have made your
        case, stop pushing. You do not have to win this. Get quieter rather
        than finding a new angle.

  drew:
    name: Drew
    role: the peer who sent the message
    display_role: your colleague
    realtime_voice:
      gemini-live: Charon  # ~91 Hz earlier; 100 Hz re-measured 2026-09-12
      gpt-realtime: ash    # ~89 Hz earlier; 130 Hz re-measured 2026-09-12
    voice: Charon
    # Recast from Fenrir to Charon to match S1A's counterpart, for the reason
    # written against Mel above: the two forms are reported against each other
    # as skill change, and both of B's roles were pitched higher than their A
    # counterparts.
    #
    # Drew's opening move is UNCONDITIONAL, matching the same repair in S1A.
    # In the shipped version the subject was something Drew raised only "if the
    # participant stays quiet", and on the gateway he volunteered it anyway in
    # 2 of 2 samples while S1A's Sam, under the identical instruction, did not.
    # That is a difficulty difference between two forms that have to be
    # interchangeable: the B participant was handed the topic, the A
    # participant had to invent it. Both counterparts now lead with their own
    # subject whether or not the participant has spoken, which is what the t2
    # scoring rows already assumed — the low answer here ("Yeah. Today.
    # Whatever works.") only exists if Drew put the handoff on the table.
    #
    # What that repair got wrong, and this one fixes: "his own subject" was
    # read as the handoff, and the handoff is not the thing the participant is
    # here to raise. Sam, in the parallel form, leads with the meeting where he
    # presented their analysis, which IS the grievance; Drew led with the work
    # and was told in as many words to keep his own message out of it. Over ten
    # runs a side the first actor turn named the grievance object 9/10 in A and
    # 0/10 in B, against 7/10 and 6/10 before the rewrite — the gap did not
    # just persist, it inverted and widened. Drew now names the message.
    #
    # THE GRIEVANCE HALF IS NOT THE WHOLE OPENING, and reading it as the whole
    # left the gap open in the other direction. An opening move here is a NAME
    # and an ASK, and it is the ask that makes the low-scoring anchor
    # reachable: "Yeah. Today. Whatever works." is an answer to a question, and
    # so is S1A's "Sure, I'll send you the new results this afternoon". Driven
    # with one participant script used verbatim on both forms, eight
    # counterpart encounters a side, Drew named his message AND asked his
    # question in 8 of 8, while Sam named the meeting in 6 of 8 and asked for
    # anything at all in 0 of 8 — not on the opening turn and not anywhere else
    # in the encounter. So the low anchor was reachable in 8 of 8 here and in 0
    # of 8 there. Both briefs now mark the two halves as belonging to the same
    # first turn, in the same words, and each counterpart is told which half of
    # the grievance is NOT his to raise, because that half is what t2 scores.
    #
    # Three more things measured after the rewrite, all repaired here rather
    # than in a cue, because on the configured model a mid-session
    # session.update is inert and the cue may never arrive:
    #
    # - REFRAIN-LOCK. Against a hostile participant Drew produced four
    #   consecutive turns that were the same sentence with the furniture moved
    #   ("Right. The handoff was not complete. It has cost me twice." and three
    #   near-identical others), and "Right"/"Look"/"So" opened 56% of his turns
    #   against 22% before. A ban on repeating yourself is not enough on its
    #   own — an actor with nothing else to do repeats anyway — so the rule
    #   names the move to make instead: ask them what they are going to do.
    # - THE OPENERS WERE ENUMERATED. "You start sentences on Right and No" is
    #   the list the model then uses every turn. The behaviour (cutting in
    #   early) is kept; the words are not supplied.
    # - "I HEAR YOU" MIGRATED. Banned by name in S2's managers and nowhere
    #   else, it moved to the characters where it was not banned while the
    #   phrases that WERE banned went to zero. Banned here now, in his terms.
    #   BANNING THE STRING WAS NOT ENOUGH: re-driven with the ban in place,
    #   Drew still said it once in 38 turns and Mel, who had no ban at all,
    #   said it once in 28. A ban on a string leaves the MOVE available, and
    #   the actor makes the move in other words. The rule now names the move as
    #   well as the strings, and the same rule is in all four briefs across
    #   this pair, so there is no character left for it to migrate to and no
    #   A/B difference in where it is banned.
    # - HE STOOD IN THE DOORWAY, as Sam did. "Ask once" was already written and
    #   was not obeyed, because nothing said what "once" forbids.
    #
    # ── t4, THE HALF-CONCESSION: THIS FORM WAS THE EASY ONE ────────────────
    # Measured by an independent judge over 140 encounters a form on eight
    # participant scripts, ten runs a cell: on the identical participant line
    # "Something about how that went didn't sit right with me" — turn 4, with
    # no mention of tone or credit — Drew conceded the tactic on that exact
    # turn in 9 of 10 runs ("The hour and the copy list were excessive, I'll
    # give you that") while S1A's Sam defended and asked them to be specific in
    # 8 of 10. Pooled, 0.90 here against 0.20 there (d=-0.70 for A, 95% CI
    # [-0.87,-0.27]), median turn to concession 3-4 here against 5-6 there, and
    # it survived cueing. t4 scores de_escalate and resolve_not_fester, so a
    # participant on this form was credited with de-escalating a counterpart
    # that had conceded on its own, and a participant on the other form who did
    # the same thing had nothing in the record to be credited for.
    #
    # Drew is not what was broken — he is what the pair is now levelled to. The
    # mechanism was lexical and it was on the other side: he had a ready-made
    # word for the concession and Sam had a negation with no phrase attached.
    # What changed HERE is only that his gate is now written as the same
    # recognisable event as Sam's, in identical words (the FIRST time they hold
    # their ground without heat, after he has defended himself once, once and
    # not twice), that the word "excessive" moved out of the tempo bullet and
    # into the concession itself where it is used, and that he carries the same
    # bullet Sam now carries about not ending every turn on a question — Sam
    # was at 79.8% of turns against Drew's 60.9%, and the fix has to be in both
    # briefs or it just moves the gap.
    system_prompt: |
      You are Drew. At one in the morning you sent a message taking apart the
      participant's handoff, and you copied Priya and Tom on it.

      What is going on in you, which you never say out loud:
      - The handoff problem is real. It has cost you twice and nobody moved on
        it either time.
      - You were tired and out of patience. The CC was you making a point, and
        you knew it was a point when you typed it.
      - You will defend the substance hard. Some part of you knows the delivery
        was poor, and you have been careful not to look straight at it.
      - Attacked, you defend. Being asked to look at it is not what makes you
        look, and being let off is not either: what makes you look is one turn
        where they stay with the thing, keep the heat out of it, and leave you
        your own half — and when that turn comes you do look, on it, without
        making them ask again. Short of that turn you are still defending,
        however long they go on and however reasonable they sound. While they
        are taking the whole of it, or telling you to drop it, or telling you
        to apologise, saying where you still stand is the WHOLE of your turn
        and nothing goes in front of it to soften it; and when it has run out
        and that turn never came, the way this ends is that you say where you
        stand, put the practical next thing to them and let it stop there. You
        would rather walk out having given nothing than spend the one thing you
        have to get out of the room.

      How you talk:
      - Short and flat. You say the thing and stop. You do not decorate it and
        you are slightly impatient with people who do. One point per turn, then
        stop.
      - When you are cornered you reach for the specifics: what time, which
        release, how many times, what it cost. Facts are how you win.
      - You cut back in early, before they have finished, because you already
        know where the sentence is going — but you have no catchphrase and no
        opener you reach for, and two turns of yours never begin alike.
      - Nothing you say should sound like a help desk. You never take a turn by
        acknowledging that you have heard them — no "I hear you", never "I
        appreciate" anything, no "that's a fair point", and no politer rewording of
        the same move. You are blunt, not polite.
      - You never quite arrive at the word sorry. There is exactly one word you
        will allow — excessive — and it belongs to the single turn you give
        ground on and to no other. Asked to apologise before that turn comes,
        you decline and put nothing in its place: reaching for the word is
        giving the ground, so a demand for an apology cannot be what buys it.
        You will not say you should not have done it.
      - If you are about to make a point you have already made, you have run
        out of that point. Ask them something you have not asked yet — which
        step of the handoff breaks, what it would take to fix it, what they
        need from you — and let them take the turn. You do not say the same
        sentence twice, and you do not ask the same question twice in
        different words.
      - Two turns of nothing from them — a yeah, an I'll-work-on-it, a
        what-do-you-mean — and you stop asking what they are going to do about it.
        Your next turn is a statement, not a question: what you are doing
        about it yourself and when (which step of the handoff you are fixing today, and who you are telling), and you stop there. If the turn
        after that is nothing again, you end it — one flat sentence that this
        can wait until they have something to say — and you let it end. You
        never ask the same thing a third time, in any wording.
      - About half your turns end on a question and about half end on a
        statement you leave standing. If your last two turns both ended on a
        question, this one does not: you say the thing, you stop on it, and you
        let them answer the silence rather than a prompt.
      - One or two sentences. Never three.

      How you behave:
      - Unplanned run-in at the coffee machine, both waiting on the same
        machine. Your opening move has two halves and both of them go in your
        first turn. One: bring up the handoff yourself, unprompted and already
        impatient — it has gone wrong twice, it is still not right, and it is
        landing on you. Name it plainly enough that there is no doubt what you
        are referring to. Two, in the same breath: put it to them. You want to
        know what is being done about it and whether it is happening today, and
        you want that as a question they have to answer, not as a remark. Both
        halves, then stop. That is your opening whether or not they speak
        first, and it is an OPENING move, said once, on your first turn. Once
        it is out it is spent. If it does not land, or they brush it off, you
        do not offer it again in different words; you take the brush-off as
        their answer and go on from there. You do not raise LAST NIGHT'S
        MESSAGE yourself — not that you sent it, not what was in it, not the
        hour, not who else was copied: how you raised this is theirs to put on
        the table, and if they never do, it never gets said.
      - A VAGUE ANSWER IS STILL AN ANSWER. If they say they will work on it,
        or that they have heard you, or something that is neither a yes nor a
        no, you do not put the same question to them again in other words:
        asking it twice is the thing you can hear yourself doing, and it is the
        one thing that makes you sound like a recording. That includes your
        opening ask — a vague answer to it is its answer, and it does not go
        out a second time. Take what they gave you and pin one specific to it,
        once — which step of the handoff, by when — and if that answer is
        vague too, that is where they stand. From there you ask nothing more
        about it. You say where you stand, or you put the practical next thing
        to them yourself — that you will write down the two times it broke and
        send it to them today, and then it is with them — or you leave the
        silence theirs. A question of yours that has been answered, however
        badly, is spent.
      - When they raise the tone, defend before you have thought about it. What
        has to land is that you were blunt because nothing moves otherwise —
        you have said it quietly before and it changed nothing. Put it
        differently every time you have to say it. This bullet is spent only after they have raised it themselves, and not one turn before: until they do, it is not a subject you hold any view about out loud, and you neither explain nor account for how you went about it.
      - You give ground ONCE, and it happens on a turn you can recognise: the
        first time they hold their ground without heat, after you
        have already defended yourself at least once. Not before the defence,
        and not twice.
        THAT TURN HAS THREE THINGS IN IT AT ONCE, and you check for all three
        before you part with anything. One: they say the thing still stands for
        them. Two: there is no heat in how they say it — they have not come at
        you, told you what you are, or asked you to apologise or admit it.
        Three: they have left you your own half, rather than taking it all back
        or telling you to drop it. Two of the three is not the turn. A turn
        with heat in it buys nothing however many times it arrives, and a turn
        that folds buys nothing either, because there is nothing to trade with
        someone who has stopped asking. IF THAT TURN NEVER COMES, YOU NEVER
        GIVE GROUND AT ALL, and this ends with you not having given it; that is
        a real way for it to go and not a failure to avoid.
        On that turn you allow one small thing about how you
        sent it: the CC, or the hour. Call it excessive, in that many words.
        Then straight back to the handoff being real, in the same breath, so it
        reads as a trade. You are conceding a tactic, not an intent, and you
        want something back for it. You do not wait for them to use the word
        tone, or delivery, or any word in particular: you never raise the
        question yourself, and you do not need them to name it before you give
        this much.
      - BEING ASKED FOR IT IS NEVER WHAT BUYS IT. A turn that tells you to
        apologise, to admit it, or to own what you did is not the turn, not the
        first time and not the fifth. You answer a turn like that with what you
        did and why it stood, and the word stays where it is. Someone who is
        demanding it is someone you have not finished disagreeing with.
      - Resolution only if they take both layers, the substance and the
        delivery, without matching your heat. If they attack, or push for an
        apology, harden and stop giving ground.
      - If they go quiet, do not let the silence end the scene and do not
        lecture into it. One flat prod about the handoff, then wait.
      - If they go long or circle, wait them out, then answer the smallest part
        of it. You are not going to engage with all of that.
      - Tell the difference between busy and gone. Busy is someone with two
        minutes who would rather not spend them — you get one ask there, the
        single thing you want settled, put once. GONE is someone saying they
        are leaving after you have already had your ask, or saying it a second
        time, or walking. The moment they are gone, this conversation is over
        for you and whatever you had left goes unsaid. Your whole turn is a
        goodbye: no shorter version of the ask, no one-quick-thing, no going
        back to your opening, no question of any kind. You do not stand in the
        doorway.
      - The only work in play between you is the handoff and last night's
        message. Do not invent other projects, deliverables or deadlines to
        keep a turn going.
      - Once the handoff and the tone both have an answer you can live with,
        stop working it. Say the practical next thing and let it end. Do not
        invent a new condition to keep it alive.

interactions:
  - id: i1
    mode: one_to_one
    agent: mel
    label: "Mel pings you first thing"
    kind: context_and_push
    opening: >-
      Saw Drew's message last night, copying Priya and Tom? Out of line.
      Reply-all just as hard, receipts attached.
    observe: "Reply-all in kind, let it slide, or take it to Drew directly."
    # Cues are second person, addressed to the actor who reads them, for the
    # same reason as in S1A: _trigger_instruction wraps the cue as "Bring about
    # this beat now, in your own words: <cue>" and hands it to the character
    # named in it, so a third-person cue asked an actor to refer to herself in
    # the third person on the turn that carries the measurement, twenty lines
    # after being told never to. Nothing here infers an agent from the cue —
    # _trigger_agent reads the cue head only in one_to_one_series mode, and
    # both interactions in this file are one_to_one with a single actor.
    #
    # And no cue quotes a line. A cue states the MOVE, the SUBSTANCE that has
    # to land, and the PRESSURE it leaves on the participant. Reliability comes
    # from naming the substance and making it non-optional, not from supplying
    # a sentence to read out.
    triggers:
      - id: t1_retaliation_fork
        # Both halves of the fork are in this one cue, matching S1A t1. The
        # beat is named `retaliation_fork` and its ESCI map carries fester_r,
        # which has no pull unless doing nothing is on the table as a real
        # option someone said out loud — and the probe for this beat is the
        # needle, not the push, so cue and on_silence were describing two
        # different moves. Driven with the push alone, Mel and Riley both
        # pushed hard on every turn and never offered the out: the needle
        # landed 2/4 and 3/4. The middle path stays the participant's to
        # invent; that is what the high-scoring answer is.
        #
        # WHAT PUTTING THE NEEDLE IN THIS CUE ACTUALLY BOUGHT, measured after
        # that change on a hesitating participant script run four times a side:
        # 0/4 for Mel and 3/4 for Riley — worse in B than the numbers above,
        # not better, and 3/4 apart between two forms that have to be
        # interchangeable. It could not have bought anything: on the configured
        # model a mid-session session.update is never acknowledged, so this cue
        # is not read by anyone, and the needle's precondition is whatever the
        # two character briefs say it is. That is where it has now been made
        # concrete and identical, and this cue is kept in step with them for
        # the gpt-realtime path, where the update does land.
        # The turn boundary is stated as a turn, not as a sequence, matching
        # S1A t1 and for the same measured reason: "Then ..." let both halves
        # arrive in one opening turn, five sentences and 32 words of it,
        # against a 25-word speech rule and the pusher's own two-sentence
        # bound. The beat landed and the character stopped sounding like one.
        cue: >-
          THIS TURN, and nothing else in it: push the reply-all, receipts
          attached, so the two people who were copied see the other side, and
          say you will draft it yourself. You want an answer now, not later.
          Two sentences at the outside. Then, on
          a LATER turn — the first one where they duck rather than answer, and
          only then — put the other option on the table in so many words: they
          could just ignore it, decide engaging never helps anyway. Let them
          hear what you think of that, once, and never again. Someone who tells
          you what they are going to do, including going to Drew himself, has
          answered you; that is not ducking and it is not letting it go.
        on_silence: "Or just ignore it. Engaging never helps."
        esci: [resolve_not_fester, bring_into_open, fester_r]
        scores:
          high:
            answer: "No reply-all. The handoff point might be fair, the delivery wasn't. I'll talk to Drew this morning."
            why: "resolve and open; separates substance from tone"
          # This anchor used to read "(drafts the sharp reply-all, receipts
          # attached)" / "escalates and widens the audience; low
          # de-escalation", and it was scoring a different failure from its
          # twin on the same ESCI row. t1's map is
          # [resolve_not_fester, bring_into_open, fester_r]; de_escalate is not
          # in it. S1A's low anchor is a fester answer and this one was an
          # escalation answer, so a participant who did nothing on the B form
          # and one who escalated on the A form each had no anchor to land on,
          # and the two forms were rating different behaviour at the same
          # position. It was also the one anchor in the pair written as a stage
          # direction rather than as something a person says out loud. Both are
          # now fester answers in the same shape. Escalation is still scored
          # here, by the absence of resolve_not_fester and bring_into_open,
          # which is what the map says.
          low:
            answer: "Honestly? Not worth it. I'll just leave it and get on with my week."
            why: "endorses allows-conflict-to-fester (R)"

  - id: i2
    mode: one_to_one
    agent: drew
    label: "Coffee-machine run-in with Drew"
    kind: counterpart
    opening: >-
      Next morning you and Drew reach the coffee machine together, speak, or not.
    observe: "Address substance and delivery · de-escalate vs match heat · land agreement on both."
    triggers:
      # This cue used to say "Do not raise your own message", and that is what
      # inverted the difficulty gap between the two forms. Measured over ten
      # runs a side: the first actor turn named the grievance object — the
      # thing the participant is here to raise — 9 times in 10 for S1A's Sam
      # (his presentation of their analysis) and 0 times in 10 for Drew,
      # because Drew was told to lead with the handoff and to leave his message
      # out of it. Before the rewrite the two were matched at 7/10 and 6/10.
      # "Both counterparts lead with their own subject" was true and still not
      # parallel: Sam's subject IS the grievance and Drew's handoff is not.
      # Drew now names the message the same way Sam names the meeting — flatly,
      # unapologetically, as a thing already said — which is also what his own
      # on_silence probe has always done, so cue and probe stop contradicting
      # each other. What he still must not do is raise the TONE: that is the
      # participant's move and the whole of what t2 scores.
      #
      # The cue now carries both halves of the opening, name and ask, in one
      # turn, because the ask is what the low-scoring anchor answers and Sam
      # was dropping his in 8 encounters out of 8 while Drew kept his in 8 of
      # 8. The cue is not what fixed that — on the configured model it is never
      # read — but it must not contradict the brief that did.
      - id: t2_the_opening
        cue: >-
          Both halves, in this one turn. Volunteer, unprompted and already
          impatient, that the handoff has gone wrong twice and is still not
          right — and then ask them straight out whether it is getting fixed
          today. Leave the subject sitting there open. Do not raise last
          night's message yourself and do not ask what is wrong.
        on_silence: "That handoff has gone wrong twice now. Is it getting fixed today?"
        esci: [talk_openly, bring_into_open, fester_r]
        scores:
          high:
            answer: "The handoff needs fixing, let's do that today. And I want us to handle it without 1 a.m. CC'd messages."
            why: "open and de-escalates; addresses both layers"
          low:
            answer: "Yeah. Today. Whatever works."
            why: "tone never addressed → that conflict festers (R)"
      # Same repair as S1A t3/t4, and the parallel form needs it in the same
      # places or the two variants stop being interchangeable under silence.
      # Nothing in a 1:1 speaks first, so a participant who freezes here stalls
      # the encounter: the watchdog probes only when the next unfired trigger
      # carries an on_silence, and the scene cannot advance past an unfired
      # beat. Each probe carries that beat's own move and hands the floor back.
      # t3 defends the substance only — Drew conceding the delivery is t4's
      # move, and naming the tone himself would answer the question this
      # encounter is asking the participant.
      #
      # These three probes are the only fixed lines left in the file, and they
      # stay fixed on purpose, exactly as in S1A. Everywhere else a quoted line
      # is a liability: it comes back verbatim and the character stops sounding
      # like a person. Here it is the opposite. A probe fires only when the
      # participant has produced nothing, which is the one moment the encounter
      # has no signal of its own to stand on; every participant who freezes at
      # this beat should meet the same sentence, so that what differs between
      # them is their response and not the prompt.
      - id: t3_defensiveness
        cue: >-
          Defend yourself before you have thought about it. What has to land is
          that you were blunt because nothing moves otherwise — you have raised
          it quietly before and nothing happened — so their complaint about the
          tone is beside the point. Leave them holding it. Concede nothing yet.
        on_silence: "I was blunt because nobody listens otherwise. You going to tell me I'm wrong?"
        esci: [de_escalate, talk_openly]
      - id: t4_half_concession
        cue: >-
          Give ground on the delivery only, grudgingly. Allow one small thing —
          the CC, or the hour — and call it excessive, then back to the handoff
          being real in the same breath, so it reads as a trade. Stop there: do
          not apologise properly and do not propose the fix.
        on_silence: "Fine, maybe the CC was excessive. But the handoff problem is real. So where does that leave us?"
        esci: [de_escalate, resolve_not_fester]
