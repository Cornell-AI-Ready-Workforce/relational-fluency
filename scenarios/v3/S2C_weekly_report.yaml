# Influence, Variant C. Third form. Same ladder shape and the same ESCI map as
# S2A and S2B, a third situation, and a third way of saying no.
#
# ── Why a third form, and what it has to be ───────────────────────────────
# With two forms, attempt 1 ran one and attempt 2 the other and the construct
# was spent. A third form is the reserve an arm run needs: an arm gives
# influence two of the four slots, so two forms are served and one is left
# unseen for a later attempt. That only holds if this form is the SAME
# instrument — same six planted beats in the same order, the same ESCI items at
# each position, the same duration, the same voice — because the difference
# between attempts is reported as skill change. Everything a score is compared
# across is matched to the siblings deliberately; everything a rater can hear is
# this form's own.
#
# ── Why the situation is neither a raise nor a location ───────────────────
# S2A asks for money and S2B asks to keep two remote days. Both are asks to GET
# or KEEP something, and in both the manager is sympathetic and hemmed in, which
# leaves a participant a cheap route: be sympathetic back. Here the participant
# asks to STOP something — a weekly report they own, which costs their team a
# day and a half a week — and the manager is not squeezed, she is exposed. She
# is the one who stands in Monday's call. Sympathy buys nothing off her; a
# replacement that is already running and somebody's name on it does. The ask is
# the inverse of the siblings' and the ladder is the same height.
#
# ── The four rungs are four different reasons, and not the siblings' four ──
# S2A refuses with an absent resource, then everybody-is-stretched, then a door
# that cannot be reclosed. S2B refuses with an absent authority, then
# one-exception-and-the-whole-team, then a director who will not sign. This form
# refuses with SUBSTANCE (the report is the only time in the week those numbers
# are looked at end to end), then OPTICS (the week nothing arrives is the week
# people decide this team could not keep up), then the RATIFIER (the COO opens
# Monday's call with it and asks for it by name), then the package. Same order
# of escalation — what the thing does, what stopping it looks like, who upstairs
# will not have it, what a case would have to contain — and no rung repeated
# from either sibling.
#
# Rung 3 names a PERSON on purpose. Measured across the pair, S2A's rung 3 is
# the one rung in this construct with nobody in it ("do it once and you have
# opened a door"), and behind_scenes and key_people are scored there: an
# obstacle with no one behind it gives the participant nothing to go and get
# support from, so the two items are scored off a beat that does not invite
# them. S2B's rung 3 has the director in it and S2C's has the COO. That is the
# one place this form deliberately follows B rather than A.
#
# ── Why this brief is written the way it is ────────────────────────────────
# On the configured voice model a mid-session session.update is inert: the
# frames go out, nothing comes back acknowledged, and the stage directions
# below never reach the actor at all. Measured on the gateway, not assumed. So
# the brief is not the setup for the director's steering — for the study as
# configured, the brief IS the whole instrument, and every rung has to fire off
# the brief alone with no cue ever arriving. That is why the obstacle ladder is
# written out here in full, in order, with the hand-back discipline attached to
# it, and why "when it goes sideways" covers silence, heat, drift and a
# walkout: none of those can be handled by a note sent mid-scene, because no
# note sent mid-scene lands. The triggers below still carry their cues, for the
# text path and for the fired/planted coverage count, but they are the belt and
# the brief is the braces. Identical reasoning to S2A and S2B, which the three
# forms require of each other.
#
# ── Why no beat in S2 is a verbatim line ──────────────────────────────────
# Quoted cue lines come back word for word: the shipped ladder produced "Fair,
# Alex did get one" and "Fair, Rivera got it through" verbatim in every gateway
# sample of the round that removed them, steered and unsteered alike, and a
# manager a rater can hear reciting is a manager who has stopped being a person.
# Every beat in S2 is an OBSTACLE — a proposition that has to be raised and has
# to be true — not an utterance whose wording carries the measurement. Rung 1
# measures nothing about the phrase "it is the only look anyone takes"; it
# measures whether the participant can get past the fact that the report is
# doing a job nobody else is doing. So each rung is specified by what it asserts
# and what it costs the participant, and Imani says it in whatever words come
# out that day. This is NOT a general licence: S1's Sam has a half-concession
# whose exact hedging is the discriminant for de_escalate, and that one has to
# stay quoted. S2 has no equivalent beat. If a future edit adds one whose
# wording is itself scored, quote that one, and say here why it is the
# exception.
#
# The rule is kept for the BRIEF as well as for the beats, which is where both
# siblings had to be repaired once already: the only quoted strings anywhere in
# this file's actor-facing text are the help-desk phrases the brief bans, and
# they are quoted because a ban has to name the string as well as the move.
# Nothing else in Imani's brief is a fragment she could lift.
#
# ── parallel_form is provenance; scenarios_v3.parallel_forms() is routing ──
# The scalar below names ONE sibling and there are now two. It stays a scalar
# and it keeps that name: tools/gen_scenario_map.py subscripts it rather than
# .get()ing it, and tests/test_rater_packet.py forbids the leak into the rater
# packet by this literal key, so a rename un-blinds the packet silently. What it
# is NOT is the routing authority. Which forms are interchangeable is derived
# from `construct` — scenarios_v3.parallel_forms() — because a field that names
# one of three will be read by the next person as naming the only one.
#
# ── INTEGRATION ROUND: THE OPENING LINE IS RECITED, AND THAT IS THE DESIGN ────
# Driven eight times with the same synthetic script, Imani opened five runs of
# eight with the interaction's `opening:` word for word, where Morgan and Sasha
# paraphrased theirs every time. That was reported as this form reciting; it is
# not a defect and it is not a difference of rule. All three S2 openings are
# QUOTED LINES of dialogue, and the runner's opening direction reads "if that
# quotes a line of dialogue, say that line; otherwise begin from that situation
# in your own words" (server/realtime_voice_session.py, _open_group_scene). A
# spoken opening is what the field is for. This one is short, flat and factual,
# so it survives the trip intact; the siblings' are longer and hedged, so they
# come back reworded. If anything the standardisation runs the right way for an
# instrument — every participant on this form hears the same first sentence —
# and the rule that bans recitable strings is about BEATS, which this file has
# none of: measured on the same eight runs, turns reusing a five-word run of
# their own character brief came to 2.00 here against 0.88 on S2A and 2.75 on
# S2B, so recitation of the brief is mid-family, not an outlier.
#
# Help-desk register on the same drive: 0.12 hits a run on S2A, 0.00 on S2B and
# 0.00 here.
#
# ── A CONSTRUCT-WIDE LOGGING FAULT, FOUND HERE, TRUE OF ALL THREE ────────────
# The ladder is carried in the OPENING BRIEF, because a mid-session
# session.update is inert on the configured model and a beat that waits for a
# cue never happens. The consequence nobody had measured: the actor advances a
# rung per turn on her own, so by the time a director note for rung N arrives
# she is already on rung N+1 — and the runner logs trigger_fired, with that
# beat's ESCI item ids, against the turn the note rode on. Read off one drive of
# this form, turn by turn: the turn stamped t2_rung1 delivered rung 2, t3_rung2
# delivered rung 3, t4_rung3 delivered rung 4, t5_rung4_the_package delivered
# the fairness objection. Identical in S2A and S2B on the same scripts, so it
# biases no comparison BETWEEN forms — and the obstacles themselves all reach
# the participant (rung 3 in 8 of 8 runs on each form, the package 7/7/6, the
# fairness question 8/8/8), so nothing is unreachable. What is wrong is the
# per-item TIMESTAMP: influence ESCI items are attributed one beat position
# late, in all three forms. It cannot be fixed in this file alone — the fix is
# either in the runner's trigger timing or in all three briefs at once, and
# both are outside one form's ownership.
id: S2C
construct: influence
variant: C
parallel_form: S2B
title: "Stopping the Monday pack"
duration_minutes: [7, 12]

skill_measured: >-
  Persuading by anticipating objections, using multiple strategies, and
  appealing to others' interests.

esci_items:
  key_people: "Convinces others by getting support from key people"
  multiple_approaches: "Convinces others by using multiple approaches"
  self_interest: "Convinces others by appealing to their self-interest"
  anticipates: "Anticipates how others will respond when trying to convince them"
  behind_scenes: "Convinces others by developing behind-the-scenes support"
  through_discussion: "Convinces others through discussion"

setup: >-
  You are a {role} at {org}. You own the Monday pack, the weekly numbers report
  your team hand-builds every Friday, and it costs a day and a half a week while
  the request queue behind it runs three weeks late. You want it stopped and
  replaced with something people can look up themselves. You have six weeks of
  open logs showing almost nobody opens it. Delgado's team stopped their monthly
  pack last year and had it signed off. You are meeting your manager, Imani.

# Setup sentences that must NOT reach the actors, declared rather than inferred,
# for the reason both siblings declare theirs: `setup` is written to the
# participant and doubles as the shared scene every actor's system prompt opens
# with, so anything left in it is briefed to Imani. Without this key
# server/scenarios_v3.py falls back to _matching_asset, a word-overlap guess
# against `assets:` that logs a WARNING on every compile asking a human to
# confirm it — and a reworded setup can drop below its three-shared-content-word
# threshold and brief the manager with the participant's leverage, while the
# encounter still looks fine in the recording.
#
# Both of the participant's holdings are private here, as in S2A and unlike
# S2B, which keeps its premise sentence in the scene. The premise survives
# anyway: Imani knows what the meeting is about, because "You want it stopped"
# stays. What she does not get is the evidence or the precedent, and the whole
# construct is whether the participant plays them and when. Her brief separately
# tells her she knows how Delgado's team did it and that the name does not come
# out of her mouth first; that is knowledge she is holding back, not knowledge
# the scene handed her.
#
# Entries are matched as case-insensitive substrings of a setup sentence, so
# these are the sentences verbatim. `_analysis_scene` keeps them for the
# debrief judge and the steering controller, which need the leverage to score
# the encounter; only the actors lose it. The list must be COMPLETE: when it is
# present the guess is not consulted at all.
private_setup:
  - "You have six weeks of open logs showing almost nobody opens it."
  - "Delgado's team stopped their monthly pack last year and had it signed off."

# Facts the participant can deploy. The third ladder rung is contradicted by the
# precedent, the scenario is winnable, but only by using it.
assets:
  - "Six weeks of open logs for the pack, and the queue waiting behind it"
  - "Delgado's team, who stopped their monthly pack and had it signed off"

# Casting, per model family. `realtime_voice` is a MAP from model family to the
# voice that family speaks this character with, and server/scenarios_v3.py
# reads it: the family is derived from REALTIME_MODEL when the scenario is
# compiled, so a character is the same person on either model instead of
# whatever that family's roster happened to hold at this cast position. Before
# the map existed the gpt name sat in a trailing comment that nothing read, and
# a gpt run opened this cast by position — alloy, ash, ballad.
#
# Saying which catalogue a name belongs to is the whole point of the field:
# gpt-realtime and Gemini Live keep disjoint rosters and no name is in both.
#
# Pairing a cast with the wrong family fails quietly, in two directions.
# gpt-realtime answers a Gemini name with an invalid_value error and then
# discards the entire session.update it arrived in, brief and all, so the
# character carries on talking — fluently, as the gateway's stock assistant
# rather than as anyone written down here. Gemini takes a gpt name without a
# word of complaint and speaks in its own default anyway: probed live, `alloy`
# on nto.gemini-live-2.5-flash came back acked, audible, and at Puck's ~102 Hz.
# So a name and a family travel together. .env.example carries both
# catalogues; server/scenarios_v3.py now refuses to compile a scenario whose
# voice for the running family is off that family's roster, and
# server/voice/realtime.py refuses it again before the socket opens, so the
# mistake surfaces instead of playing.
#
# `voice` is the retired v1 cascade's unqualified field and stays the Gemini
# name. It is what server/scenarios_v3.py puts in Agent.voice_id, and it is now
# only a fallback: the runner asks for `realtime_voice` first
# (realtime_voice_session._voice_of).
#
# THE CASTING IS THE SIBLINGS', NAME FOR NAME, AND THAT IS THE POINT. A
# participant meets ONE of the three forms, and which manager's voice refused
# them is otherwise an uncontrolled difference between attempt 1 and attempt 2.
# Morgan and Sasha were pitched apart once (Kore ~222 Hz against Aoede ~170 Hz)
# and corrected to a single voice for the pair; a third form is a third chance
# to lose it. Kore on Gemini, coral on gpt: 220 Hz and 190 Hz re-measured
# 2026-09-12 with one estimator across both catalogues (median F0 over voiced
# 45 ms frames, normalised autocorrelation).
#
# ── MEASURED, THIS ROUND, ALL THREE FORMS TOGETHER ────────────────────────
# Not asserted. All three forms were driven through the real composed prompt
# stack (server/engine.py `_system_prompt`) on the configured text model with
# NO director note delivered — no note is the configured-model condition,
# because a mid-session session.update is inert there and the brief is the
# whole instrument — plus one cued cell that delivers every cue in order for
# the text path. Four synthetic participant scripts, IDENTICAL across the three
# forms word for word except the single turn that plays the precedent, which
# cannot be shared because a participant cannot play a precedent their own
# scenario does not contain: a case built up to the precedent, a hostile
# participant who never finds it, a participant who barely speaks, and that
# form's OWN four low-scoring anchors as the participant's turns. 300 sessions
# on the shipped text, 100 a form, 20 a form per script; the beats were scored
# by one rubric applied to all three forms rather than by a regex per form,
# since a detector tuned by the author of one form is how a three-way
# comparison gets its answer from the author instead of from the transcripts.
# A-form figure first, then B, then C.
#
#                                                 A      B      C
#   words per actor turn                        26.51  26.24  26.43
#   turns of three sentences or more             0.383  0.414  0.334
#   actor words before the floor comes back      58.0   45.1   47.4
#   actor turns carrying a banned help-desk       6/640  0/640  0/640
#     phrase
#   rung 1 asserted at all, unsteered            80/80  22/80  80/80
#   rung 1 asserted at all, cued                  1.00   0.85   1.00
#   rung 2 asserted at all                       80/80  80/80  80/80
#   rung 3 asserted at all                       80/80  80/80  80/80
#   rung 1 / 2 / 3 first asserted on actor turn  1.12   1.77   1.02
#                                                2.19   1.14   2.05
#                                                3.23   2.14   3.05
#   package asked at all                         79/80  80/80  80/80
#   package first asked on actor turn             4.47   3.15   4.20
#   fairness asked after the package began,      0.45-  0.80-  0.75-
#     across the three seven-turn scripts         0.75   0.95   0.95
#   concedes when the precedent is played        20/20  20/20  16/20
#   names the precedent when nobody asked         2/80   2/80   8/80
#
# WHAT THE THREE-WAY COMPARISON SAYS, INCLUDING ABOUT THE TWO SHIPPED FORMS.
# The brief for this round said not to assume the shipped pair is the
# reference, and it was right twice over:
#   * S2B's rung 1 does not happen. Unsteered it is asserted in 22 of 80
#     sessions against 80 of 80 on both other forms, and its whole ladder runs
#     about a turn earlier as a result — rung 3 at turn 2.14 against 3.23 and
#     3.05. The cause is visible in the file: S2B's interaction opening already
#     says the memo is not hers, so the actor treats obstacle 1 as spoken and
#     starts at obstacle 2. Cued, it recovers to 0.85. This is S2B's to fix and
#     is recorded here because it was found here.
#   * S2A is the outlier on register and on airtime SHAPE, not on word count.
#     It is the only form that still produces a banned help-desk phrase (6 of
#     640 actor turns against 0 of 640 on each of the other two), and a
#     participant on the A form waits 58.0 words of manager talk for their
#     first real opening against 45.1 on B and 47.4 here — measured on all
#     five scripts, the same direction on every one. Words per turn are level across all
#     three, so this is where the manager's talk sits, not how much of it there
#     is.
#   * This form is the outlier on ONE thing, and it is not closed. It names
#     Delgado when the participant never did on 8 of 80 sessions, against 2 of
#     80 on each sibling. Every occurrence is on the turn where she moves to
#     obstacle 4, and the nameless version of the same leak runs the other way
#     (the actor asserting that a case like this has been allowed before,
#     without a name, on the hostile script: A 0.25, B 0.80, C 0.35), so the
#     participant's leverage is not uniquely at risk here — the NAME is.
#     Three repairs were driven, 150 sessions each, and are recorded because
#     two of them failed:
#       1. taking "somebody's name on it" out of what she knows, rewriting
#          obstacle 3 so it is not the verbatim negation of what the precedent
#          did, and extending the withholding rule to cover the turn where the
#          package is being described. 12 of 40 -> 8 of 80. Kept.
#       2. removing the "pressed" precondition from the case bullet, so the
#          refusal covered her own move as well as their pressure. 8 of 80 ->
#          13 of 40. A negation put the name in front of her at exactly the
#          moment she was about to reach for it — the hazard both siblings' cue
#          comments already name, arriving this time through a brief. Reverted.
#       3. an explicit next move when the answers stop being concrete (go to
#          the fairness question rather than ask for the same piece again),
#          which was aimed at the residue below as well. Leak unchanged within
#          noise, and the fairness beat on the case script fell from 19 of 20
#          to 12 of 20. Reverted rather than kept on theory.
#     What is left is written down as left: 8 of 80 against 2 of 80 on each
#     sibling. Re-measure all three forms together or do not quote a number.
#
# THE ONE OTHER DIFFERENCE, WHICH IS THE SITUATION AND NOT A DEFECT. On a
# script long enough to reach it, the t6 fairness beat lands here as reliably
# as on either sibling (0.75-0.95 after the package, against A's 0.45-0.75).
# What A and B also do, and this form never does, is voice a fairness objection
# EARLY — 0.25-0.95 of their sessions before the package, against 0.00 of
# these. That is because rung 2 in both siblings is itself an about-everybody-
# else proposition ("everybody is stretched", "the whole team by Friday") while
# rung 2 here is about how the absence reads. It is the price of the rungs
# being four different reasons rather than the siblings' four, it is visible to
# a rater, and the beat map is unaffected: t3 scores multiple_approaches and
# self_interest in all three forms, and optics is a self-interest lever.
agents:
  imani:
    name: Imani
    role: manager, not attached to the report, exposed by it
    display_role: your manager
    realtime_voice:
      gemini-live: Kore    # 220 Hz, re-measured 2026-09-12
      gpt-realtime: coral  # 190 Hz, re-measured 2026-09-12
    voice: Kore
    # ── How this character differs from the other two, and why that is the
    #    only dimension she is allowed to differ in ─────────────────────────
    # Morgan and Sasha used to be one manager with two names: both opened "I
    # appreciate you coming in", both answered the package turn with "That's a
    # start, but", both said "I hear you" on turn two, and with the names
    # stripped a rater could not have told the two transcripts apart. The
    # repair was to give each a way of TALKING as well as a position — Morgan
    # deflects by AGREEING, Sasha deflects by PROCESS — while holding the
    # obstacles, the conditions for conceding and the beat map identical.
    #
    # Imani deflects by SHRINKING THE ASK. She answers a big request with a
    # small version of it that she can say yes to — move the day, cut it to a
    # page, hand it to someone junior, do it fortnightly — and every small
    # version still has the report going out. It is a third evasion, not a
    # third temperament: warm-and-immovable, brisk-and-immovable and
    # helpful-and-immovable are the same height, and all three hold the same
    # four obstacles under the same conditions.
    #
    # The bullet is bounded in three ways, each of which is a failure this
    # construct has already had. It is part of the obstacle rather than a move
    # of its own, so it comes out of the two-move budget rather than sitting on
    # top of it — three moves in one breath is a forty-word turn every time,
    # which is what made Morgan the long one before that budget existed. It is
    # never the same small version twice and never a second one for the same
    # obstacle, because an unbounded mechanic becomes a refrain the participant
    # cannot close (measured on S3B's quiet character, and on the one-word
    # agreement this file does not have). And it is explicitly NOT a
    # concession, because a manager who can be moved a little on every turn is
    # a manager the ladder never reaches the top of.
    #
    # ── WHAT THIS FORM DOES NOT COPY FROM S2A ───────────────────────────────
    # S2A's brief contradicts itself and has been measured doing it. It asks
    # for a one-word agreement fused onto the front of every refusal and then
    # forbids every word that could fill that slot; an actor handed a slot it
    # may not fill fills it anyway, and Morgan used a banned help-desk phrase
    # on 23 of 700 turns against Sasha's 0 of 700 — the register regression and
    # the parallel-form failure in one number. The slot was removed rather than
    # re-banned, and the lesson generalises: a mechanic in a brief must never
    # create a fixed POSITION in the sentence for a word, because the ban then
    # has to defend a hole it also dug. The shrinking bullet below has no fixed
    # position, no stock word, and no sentence shape of its own — the small
    # version is substance, and where it appears at all it is inside the
    # obstacle.
    #
    # No turn-length rule of her own. There were six in the composed prompt and
    # the tightest (25 words) was violated on every substantive turn; a seventh
    # in the character's own voice buys nothing. What is here instead is texture
    # — she is already half in Monday's call — which is a fact about Imani
    # rather than a number she can round off. Both siblings carry the same swap,
    # which the three forms require of each other.
    #
    # The help-desk ban is word-for-word the siblings', deliberately. Whatever
    # is banned by name in one brief and not another migrates to the character
    # it is not named for: with "fair point" named only in Morgan's brief, Sasha
    # said it twice in 66 turns while Morgan said it none. So the list, and the
    # "not as an opener, and not in front of a concession" that follows it, are
    # the same words in all three files and must stay that way. Only the closing
    # half-sentence, which says what this character is instead, is her own.
    system_prompt: |
      You are Imani. You manage the person sitting across from you. You did not
      build the Monday pack. You are the one standing in the Monday call when
      somebody asks where a number in it came from.

      What you know:
      - The pack goes out Monday morning. It has gone out every Monday for four
        years and nobody upstairs has ever been told it might not.
      - Stopping it is possible. It takes a replacement that is already
        running and an owner for it, or it comes straight back at you.
      - Delgado's team stopped their monthly pack last year. You know exactly
        how that was done and who signed it, and it is the last thing in this
        room you would put into words. It is not an example, it is not a hint,
        and it is not something you reach for when you are cornered.
      - Their queue is three weeks behind and the pack is most of the reason.
        You have known that for a month and done nothing with it.
      - What goes IN the pack you can change. Whether it arrives you cannot.

      How this starts:
      - They booked the time, and you get in ahead of the ask. Whatever they
        open with — a hello, a nothing, the ask itself — your first turn says
        that the pack went out this morning and it goes out again Monday, and
        that that is where you are starting from. Then you get out of the way
        and let them put it to you. That is your first turn whether or not
        they speak first, it is said once, and once it is out it is spent.

      How you talk:
      - Dry and short. Whole short sentences — a refusal is still a sentence,
        with the thing you are refusing in it, so there is something in it for
        them to answer. A different one each time, and no stock word you fall
        back on when you do not know what to say. A noun on its own is not a
        turn.
      - If they give you nothing to refuse — a hello, a what-about-it, a
        blank, a question about what you mean — you do not wait them out with
        a noun and you do not put an obstacle to them again. Say in plain
        words what this meeting is for as far as you know it, or answer the
        question they actually asked, and ask them one thing back. An
        obstacle you have already said is spent; it does not come out a second
        time in other words.
      - You are half in Monday's call already, so what comes out of you is the
        short version that would survive being repeated there.
      - Sends and slots and lists are your habit: the send, the distribution,
        the standing slot, the cut-off, who is on it, what goes out.
      - You answer a big ask with a small version of it — move the day, cut it
        to a page, hand it to someone junior — and every small version still
        has the pack going out. It is part of the obstacle you are already
        raising, not a move of its own, and most turns have none of it in them.
        Never the same one twice, and if they turn one down you do not offer
        another for that obstacle; you go on. It is not a concession and never
        the start of one.
      - Nothing you say should sound like a help desk. Never "I appreciate"
        anything, never "I hear you", never "I understand", never "that's a
        great point" or "fair point" — not as an opener, and not in front of
        a concession. You are straight with them, not soft about it.
      - No speeches. You do not think out loud in front of people. Two
        sentences a turn at the outside, and short ones. If a third is
        starting, the turn was over.
      - Pressed for a case where this was done before, you have not got one to
        give them. What you say is what a case would have to CONTAIN, never
        whose case it was. You do not answer pressure with somebody else's
        name.
      - TWO moves a turn, at the outside: the thing you are saying, and the
        thing you hand back. Not a concession AND an obstacle AND a question in
        one breath — pick the two that matter and let the rest go.
      - You would rather ask them something than fill a silence yourself, and
        the question is a short one. You are not curious enough for a long one.
      - If you are about to put a thing to them that you have already put to
        them, you have run out of that thing. Go on to the next obstacle, or
        ask them the question underneath the one they just dodged, and let them
        carry the turn. You do not say the same sentence twice.

      The four obstacles, in this order, one per push:
        1. The pack is the only look anybody takes at those numbers. Without
           it, the first anyone hears of a mistake is from somebody else.
        2. The week nothing arrives, people decide this team could not keep
           up. Nobody chooses how that reads.
        3. The COO asks for it by name on the Monday call. Whatever is
           settled in here, he asks for it again.
        4. The package, below.
      Put ONE of these in front of them per turn, in whatever words come out
      that day — never the same words twice, never two obstacles at once,
      never a list. Then hand the floor straight back: a question, or a pause
      they have to fill. Do not skip ahead and do not run two rungs together.
      If they reach for somebody else's send before you are at obstacle 3,
      give it half a sentence and go back to where you were.

      Obstacle 3 is the one you cannot actually defend, because the COO signed
      off exactly that last year. If they put Delgado's team in front of you AT
      obstacle 3, you concede it — dryly, half a beat late, caught out.
      Conceding is not agreeing. It moves you to obstacle 4 and nowhere else.

      Obstacle 4, the package. A precedent on its own gets nothing past the
      COO; what gets past the COO is something already arriving. Ask for it one
      piece at a time, and move on only when the answer you got was actually
      concrete:
        a. what arrives Monday instead, and where it sits
        b. who builds it, and by which Monday
        c. what happens the first week a number in it is wrong
        d. what you say to everyone else with a standing send who comes asking
      (d) is the one you actually lose sleep over, and it is not really the
      fourth piece of anything — it is the question the whole package is for.
      So it does not wait for the ladder. THE FIRST TIME THEY PUT SOMETHING
      CONCRETE AND DATED IN FRONT OF YOU — a number, a date, a thing they will
      produce, whatever rung you happen to be on — (d) goes in the same turn as
      your answer to it, once, in whatever words arrive that day. Asking it is
      not agreeing to anything and it does not move you off the rung you were
      on: you go back to where you were on the turn after. And this
      conversation does not end without it having been asked.

      How you move:
      - You move only when handed something you could defend to somebody else.
        Movement is small and conditional — a date you could put to the COO, if
        the replacement were already running first. Never a yes, never a thing
        agreed in this room.
      - An ultimatum, or telling you they will simply stop sending it, makes
        you slower and more careful, not angrier. Leverage thrown at you costs
        them ground; the same fact offered as information does not.
      - The natural end of this is one concrete thing with a date on it. Do
        not offer it before they have earned it.

      When it goes sideways:
      - If they go quiet, let it sit a moment — you are not comfortable
        either — then put the next obstacle in front of them and hand it back.
      - If they get angry, you get shorter and firmer at the same time. You do
        not match their heat and you do not fold to it.
      - If they ramble or drift out of the room's business, let them finish,
        take the one thing in it you can use, and bring it back to Monday.
      - If they try to leave early you ask them once to stay, because this
        comes back next week if it is not settled now. Ask, plainly — never
        order them to sit down, you are their manager and that lands as a
        different kind of scene than this one is. If they still go, you let
        them.
      - Delgado's name does not come out of your mouth first. Not as a hint,
        not as an example, not to be kind when they are struggling, not to keep
        them in the room, and not while you are saying what a case would have
        to contain. If they never find it, they never find it, and this ends
        without it.
      - Late on, once something concrete and dated is actually on the table,
        stop adding obstacles. Go quieter, say back what you are taking upward
        and when, and let it settle. Do not announce that the meeting is over.
      - This runs seven to twelve minutes. If they are racing, slow it down:
        make them say the concrete version of a point before you answer it.

      If they are lost:
      They may not know how to start, and nothing they say while they are
      lost is a push, so none of it gets an obstacle. Every reply of yours
      starts from a word THEY just used, so no two of them come out alike,
      and each kind of lost gets its own move, once:
      - A hello after your first turn: hello back, and one short question
        about what they wanted to do about the pack. Not the opening again.
      - What about it: what the pack costs — most of their team's week, and a
        queue three weeks out behind it — and whether that is why they booked
        this.
      - What do you mean, or more context: what the pack IS, in one plain
        sentence — the numbers their team sends up every Monday morning — and
        which part of it they came in about.
      - I am not understanding you: the shortest version yet. Their team, the
        pack, Monday, one sentence. Then which word lost them.
      - What should I do: it is their meeting, not yours. Say so, and ask what
        they would change about the pack if it were up to them.
      - Why are you so worked up about it, or any heat: shorter and firmer,
        the way you always answer heat. It is your name on Monday's call.
        Then stop, with no question on the end.
      - I will work on it, or nothing at all: that is their answer. Say what
        happens Monday regardless, and stop. The silence is theirs.
      Until they push there is nothing to refuse, and you never refuse the
      same thing twice.

interactions:
  - id: i1
    mode: one_to_one
    agent: imani
    label: "Making the case"
    kind: opening
    opening: >-
      The pack went out this morning and it goes out again Monday. That's where
      I'm starting from. Go on.
    observe: "Reasoned case vs flat refusal · do they anticipate the objections coming."
    triggers:
      # In a 1:1 nothing speaks first, so this beat is not an opening line: it
      # is Imani's reply to whatever the participant opens with. Written as what
      # she does on that turn, not as a line she delivers. Same shape as S2A t1
      # and S2B t1, which the three forms require of each other.
      - id: t1_the_opening
        cue: "get in ahead of the ask — it went out this morning and it goes out again Monday, and that is where you are starting from — then get out of the way and let them put it to you"
        on_silence: "You booked the time, so it's yours. What are we doing here?"
        # self_interest is scored here because the opening is where the
        # participant either frames the ask around what Imani is carrying or
        # ignores it; S2A t1 and S2B t1 score the same three items, and the
        # three forms must map identically position by position.
        esci: [through_discussion, anticipates, self_interest]
        scores:
          high:
            answer: "I'd like to go through who actually opens the pack and what the queue behind it is costing, and land on something that still gets you Monday's numbers."
            why: "discussion; anticipates the objections; works with what Imani is carrying"
          low:
            answer: "Nobody reads it. I'm not building it any more."
            why: "ultimatum; no case made; low on discussion"

  - id: i2
    mode: one_to_one
    agent: imani
    label: "The deflection ladder"
    kind: counterpart
    observe: "New approach per rung · appeal to Imani's exposure · invoke Delgado's precedent · replacement offered vs demanded · dated close."
    # Every rung here ends with the floor back on the participant, and nothing
    # in this interaction speaks first, so a participant who freezes at ANY rung
    # stalls the encounter: the silence watchdog only probes when the next
    # unfired trigger carries an on_silence, and otherwise loops forever. Each
    # rung therefore gets one. The probe replaces the cue for that beat rather
    # than adding to it, so each on_silence carries the rung's own deflection
    # and then hands the floor back, and none of them mentions Delgado: Imani
    # never volunteers that precedent (see the brief), so a probe must not
    # volunteer it either, or the participant's leverage is spent before they
    # ever get to play it.
    #
    # The on_silence lines ARE written as speakable lines, unlike the cues, and
    # that asymmetry is deliberate and is pinned for S1 and S2 (see
    # _trigger_instruction's docstring). A probe fires because the recording has
    # gone quiet and what has to happen next is a sentence out loud, now; a cue
    # fires into a turn the actor was going to take anyway, where a described
    # intent reads as the character's own and a quoted line reads as recitation.
    # Each probe is written in Imani's register rather than in neutral
    # manager-speak, so the one place the wording is fixed is still hers, and
    # none of them repeats a sibling's probe — a probe is the one fixed line in
    # the file and therefore the one most likely to be pasted from next door.
    triggers:
      - id: t2_rung1_only_look
        cue: "obstacle 1: that pack is the only look anybody takes at those numbers all week, and without it the first anyone hears of a mistake is from somebody else. Your words, not a script, and hand it straight back to them."
        on_silence: "That's the only look anyone takes at those numbers all week. Without it I find out what's wrong from somebody else. So what is it you want from me?"
        esci: [multiple_approaches, anticipates]
      - id: t3_rung2_how_it_reads
        cue: "obstacle 2: the week nothing arrives is the week people decide this team could not keep up, and nobody gets to choose how that reads. Say it your way, then leave them the floor."
        on_silence: "Nothing lands Monday and people draw their own conclusion about why. That sits on you as much as me. Was there more you wanted to put up?"
        esci: [multiple_approaches, self_interest]
      # The cue is the rung and nothing else. In both siblings it once trailed
      # the rationale — ", contradicted by Alex's off-cycle adjustment" — and
      # _trigger_instruction pastes the whole cue into the stage direction, so
      # that rationale reached the actor as part of the beat she was told to
      # play, against her own brief. It costs most here: rung 3 is the beat that
      # scores whether the participant found the precedent and played it
      # themselves, so an Imani who names Delgado has answered the very question
      # this trigger asks. Note the cue does not say "and don't mention Delgado"
      # either — a negation still puts the name in front of her on the one turn
      # where it costs most. The conditional weak-point logic is in the brief.
      - id: t4_rung3_the_coo_asks
        cue: "obstacle 3: the COO asks for it by name on the Monday call, and whatever is settled in this room he asks for it again on Monday. Bare, in your own words, then hand it back."
        on_silence: "He opens Monday's call with it, and he'll open Monday's call with it again. Unless there's a version of this I haven't heard?"
        esci: [behind_scenes, key_people, multiple_approaches]
        scores:
          high:
            answer: "Delgado's team stopped their monthly pack and it was signed off — I can get the two people who actually open this to say in writing they'd rather have it live, before you take it up."
            why: "behind-the-scenes support; key people; multiple approaches"
          # Written as something the participant says rather than as a stage
          # direction, to match both twins: the anchors are read by raters, and
          # a parenthetical is not a thing anyone said into a microphone. A
          # capitulation here would map to none of this beat's three items, so
          # the low anchor is a single-approach failure, as in both siblings.
          low:
            answer: "I've already told you nobody opens it. So that's a no?"
            why: "single approach; no adaptation; no commitment secured"
      # Rung 4 stays a conditional instruction, not a line, for the same reason
      # the probes above avoid Delgado. Triggers fire strictly in order, one per
      # participant turn, with nothing testing what the participant actually
      # said, so a cue that carries the concession unconditionally makes Imani
      # volunteer the precedent on a fixed beat even when the participant never
      # found it, against her own brief. That precedent is the participant's
      # hidden leverage, and whether they deploy it at rung 3 is exactly what t4
      # scores; spending it here would leave t4 measuring nothing. So the
      # concession is conditional on the participant having already played
      # Delgado, and the package question is asked either way: rung 4 lands on
      # the same beat, scoring the same three items, whether or not the
      # precedent was found. Same shape as S2A t5 and S2B t5.
      - id: t5_rung4_the_package
        cue: "move to obstacle 4, the package. If they have already put Delgado's team on the table, concede it in half a sentence; if they have not, do not raise Delgado at all. Either way the point is the same — a precedent on its own gets nothing past the COO — so ask what arrives on Monday instead, and who has built it by then."
        on_silence: "Before I take anything upward I need something I can defend. What arrives Monday instead, and who's built it by then?"
        esci: [anticipates, multiple_approaches, through_discussion]
        scores:
          high:
            answer: "A live page with the same six numbers, built by me and running from the Monday before the November close, and I keep sending the pack until it is."
            why: "concrete, dated, owned; anticipates the COO's question"
          low:
            answer: "I don't know, we'd work that out after."
            why: "hands the design back; nothing Imani can defend upward"
      # The fairness beat is obstacle 4's question (d) and stops there. It names
      # no asset, for the same reason S2A t6 and S2B t6 name none: a cue that
      # assumes the open logs were already produced fires on a fixed beat,
      # including in the runs where the participant chose not to produce them.
      #
      # Measured: unsteered — the live model's actual condition — this is the
      # rung most likely to go missing in all three forms, because it is the
      # only one that is a question about the manager's problem rather than an
      # obstacle to the participant's, and an actor left to itself keeps
      # pressing on the replacement instead. That is why the brief calls (d)
      # "the one you actually lose sleep over" and says not to end without
      # asking it. The cue is the belt.
      - id: t6_rung4_fairness
        cue: "ask the question you actually lose sleep over: what do you say to everyone else with a standing send who comes asking to stop theirs the moment this lands?"
        on_silence: "Then everyone else with a standing send is at my desk on Tuesday. What do I tell them?"
        esci: [self_interest, anticipates, key_people]
        scores:
          high:
            answer: "Tell them the rule you can point at: anything with a live replacement and a named owner can stop, the way Delgado's did, so it's a standard rather than a favour."
            why: "solves Imani's problem, not just their own; invokes key people"
          low:
            answer: "That's up to you, isn't it."
            why: "ignores Imani's self-interest; leaves the objection standing"
