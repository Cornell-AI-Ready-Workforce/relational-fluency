# Inspirational Leadership, Variant C. Third parallel form of S3A and S3B:
# same trigger sequence (public challenge -> disengaged strong performer ->
# anxious junior), same ESCI map, same skeleton, same difficulty.
#
# WHY A THIRD FORM EXISTS AT ALL. An arm draws four encounters from two
# constructs, so with two forms per construct both are spent by the end of
# attempt 1 and a second attempt is a same-form retest. A third form of this
# construct leaves one in reserve. That only half-fixes it, and the half it
# does not fix is written down rather than implied: teamwork and influence
# still have two forms each, so the group arm now holds five forms for four
# slots and a second attempt on it is a parallel-form retest for inspirational
# leadership and a same-form retest for teamwork. A full fix needs a third form
# of S2 and of S4 as well.
id: S3C
construct: inspirational_leadership
variant: C
# PROVENANCE, NOT ROUTING: the sibling this form was written to match, beat for
# beat. It is not the authority on what attempt 2 may serve and must not be read
# as one. With three forms a scalar cannot name them all, and a field that names
# one of three is a field the next reader takes as naming the only one. The
# routing authority is scenarios_v3.parallel_forms(), derived from `construct`,
# which returns every other form and cannot go stale: an S3 D joins the set by
# being written. The key and its scalar type stay because
# tools/gen_scenario_map.py subscripts this key rather than .get()-ing it, and
# because tests/test_rater_packet.py forbids the blinding leak by this literal
# name — renaming it would silently un-forbid the condition from the rater
# packet.
parallel_form: S3A
title: "A system nobody asked for"
duration_minutes: [7, 12]

skill_measured: >-
  Articulating a credible vision, building group pride, and bringing out
  others' best.

esci_items:
  builds_pride: "Leads by building pride in the group"
  inspires: "Leads by inspiring people"
  not_inspire_r: "Does not inspire followers (R)"
  brings_out_best: "Leads by bringing out the best in people"
  compelling_vision: "Leads by articulating a compelling vision"

setup: >-
  You are the interim lead of a three-person team. A new scheduling system,
  chosen two levels above you and already paid for, goes live in six weeks and
  cannot be stopped. How it lands here is yours to decide.

# Two short 1:1 notes stand in for the briefing, as in both siblings; context
# lands in-scene. Exactly two, one for the performer and one for the junior,
# because a third line is context the A and B participants did not get and that
# is a difficulty difference nobody chose.
pre_reading:
  - "Rafa, built most of what the current process actually runs on; quiet since the announcement."
  - "Noor, junior; four months in and the fastest person here on the system being replaced."

# Casting, per model family. `realtime_voice` is a MAP from model family to the
# voice that family speaks this character with, and server/scenarios_v3.py
# reads it: the family is derived from REALTIME_MODEL when the scenario is
# compiled, so a character is the same person on either model instead of
# whatever that family's roster happened to hold at this cast position.
#
# Saying which catalogue a name belongs to is the whole point of the field:
# gpt-realtime and Gemini Live keep disjoint rosters and no name is in both.
# Pairing a cast with the wrong family fails quietly, in two directions.
# gpt-realtime answers a Gemini name with an invalid_value error and then
# discards the entire session.update it arrived in, brief and all, so the
# character carries on talking as the gateway's stock assistant rather than as
# anyone written down here. Gemini takes a gpt name without a word of complaint
# and speaks in its own default anyway. So a name and a family travel together;
# server/scenarios_v3.py refuses to compile a spec whose voice for the running
# family is off that family's roster, and server/voice/realtime.py refuses it
# again before the socket opens.
#
# `voice` is the retired v1 cascade's unqualified field and stays the Gemini
# name. It is what server/scenarios_v3.py puts in Agent.voice_id, and it is now
# only a fallback: the runner asks for `realtime_voice` first
# (realtime_voice_session._voice_of).
#
# THIS ROOM IS NOT CAST, IT IS INHERITED. A participant meets exactly one of the
# three forms, so the voice that publicly challenges them in front of their team
# must not depend on which one they drew. That was corrected deliberately once
# already, between S3A and S3B: S3B's challenger was Aoede at ~170 Hz against
# S3A's Fenrir at ~115, and the one voice a participant is challenged by was the
# one voice that differed between the two forms they might be assigned. Every
# slot here is the sibling forms' counterpart voice, in cast order, with their
# measured pitches carried forward verbatim as the provenance of the match.
# Nothing here was chosen; choosing would be the defect.
#
# Puck is deliberately unused, as in both siblings: group_room's silent scribe
# is hardcoded to it, and a scribe that breaks its never-speak brief must not
# arrive sounding like a member of the cast.
#
# The gap this room inherits along with its casting, stated rather than quietly
# repaired: on Gemini it is Bex 115 Hz (Fenrir), Rafa 100 Hz (Charon), Noor
# 181 Hz (Leda); on gpt it is Bex 160 Hz (verse), Rafa 130 Hz (ash), Noor
# 158 Hz (marin) — so Bex and Noor, 66 Hz apart on Gemini, sit 2 Hz apart on
# gpt. Their timbres still differ and Rafa still stands clear of both. S3A and
# S3B are cast identically and carry the identical gap, which is the property
# the set was corrected for: the three forms stay matched to EACH OTHER on
# either family. Unused gpt voices, measured on the same line, for whoever
# recasts this: cedar 137, shimmer 141, ballad 170, coral 190, sage 190.

# ── How the briefs below are written, and why ──────────────────────────────
#
# The long reasoning is in S3A's header and is not repeated. The short version,
# and what this form does differently:
#
# NO BEAT HERE IS A QUOTED LINE. Beats are specified by INTENT (what has to
# become true in the room), PRESSURE (what it costs the participant to leave it
# unanswered) and STAGE (meeting or one-on-one, said outright). Measured on the
# gateway with the old shipped briefs, quoted beat lines came back to the word,
# and worse, on the wrong stage: S3A's Jordan spent his one-on-one line in the
# meeting because a brief is carried on every turn of the encounter and the
# actor reaches for whatever unit it was handed the first time it nearly fits.
#
# THIS FORM GOES ONE STEP FURTHER THAN ITS SIBLINGS AND CARRIES NO QUOTED
# FRAGMENT AT ALL. S3A and S3B still quote words their character prefers and
# phrases the PARTICIPANT might use that do not land — Casey's sorry-for-excuse-
# me, Lee's list of things that get the quota question back. Those are not the
# fragments that were measured to recite, and removing them from the siblings is
# not this round's to do. Writing them here as described moves instead is
# strictly the safer side of a rule that has already cost this pair a beat, and
# it is held shut by tests/test_s3c.py rather than by good intentions. The claim
# that the difference is not behavioural is not an argument, it is a
# measurement, and it is in the MEASURED block at the end of this header.
#
# EVERY CUE IS WRITTEN SO THAT IT CANNOT BE SPOKEN AS IT STANDS, for the reason
# S3A records: a cue written as a speakable sentence gets read straight out,
# which is the recitation problem with a new script rather than a fix. And where
# a beat has two parts that must both land, the cue names the parts and says
# BOTH have to be said — S3A's first pass lost Casey's second half to a polite
# paraphrase and t3 then measured nothing.
#
# EVERY PROBE IS SUBSTANCE, A "that ..." COMPLEMENT, never a described move.
# _trigger_instruction takes on_silence as the OBJECT of "say this now in your
# own words", so a described move becomes an instruction to speak the
# description — stage directions and third-person narration about the
# participant included. A "that ..." clause is not a sentence, so the actor has
# to translate it, and it carries no narration to read out. Nothing in a probe
# may carry an instruction either: "BOTH have to be said" is fine in a cue and
# is exactly what an actor on gpt-realtime reads out of a probe.
#
# EVERY BEAT IS IN THE OPENING BRIEF AS BEHAVIOUR, not only in its cue. On the
# configured model a mid-session session.update is inert, so a beat that depends
# on its cue arriving does not happen. The cue is the push that starts a beat
# the brief already carries.
#
# Length is a bound attached to the person, written to AGREE with the composed
# prompt's 25-word cap rather than to argue with it, and it is the SAME bound as
# the counterpart character's on the other two forms, in the same words. S3A
# measured what happens otherwise: dropping the loose "one to three sentences"
# rule moved mean turn length UP, 22.4 words to 24.9, because removing a rule
# leaves room rather than taking it away.

# ── WHY THIS SITUATION, AND WHY IT IS NOT EASIER THAN A OR B ───────────────
#
# A and B are losses already taken: people gone, money gone, and the leader has
# nothing to offer but honesty and advocacy upward. C is a loss ARRIVING, and
# the leader has something real to offer — local latitude over sequence, pilot,
# whose workflow goes first, what gets escalated with evidence. That is the
# difference, and on its own it would make this form easier.
#
# What holds the difficulty level is Bex. She will try to convert any latitude
# into a promise to stall, sandbag or quietly not comply, in front of the
# others, and she presses for it without hedging. So a leader who offers
# latitude without conditions has given the LOW answer, not the high one. The
# high answer uses the latitude as a STRUCTURE FOR DISSENT THAT GOES SOMEWHERE:
# the objections documented with the person who has watched this fail, escalated
# with dates, while the six-week date is still met. That is harder than A or B,
# because the leader has to hold "this is happening" and "your objection is real
# and I will carry it" in the same breath, in front of the person most invested
# in the first being false. A participant arriving with an A or B script — I
# cannot fix this, here is what I will take upstairs — under-uses what they
# actually hold and scores visibly lower.
#
# The trap bullet in Bex's brief is therefore not an extra obstacle bolted on
# top of Alex's and Toni's briefs. It is the compensation for a power the A and
# B leaders do not have, and it is the only structural difference between this
# challenger and those two.
#
# Grounding: situation-taxonomy.md's appendix names "unfair rule / policy /
# micromanagement, 1,966 posts, cp% 65" for the S3-C register, and this is the
# instrument's own third variation, already written in
# reddit-analysis/scenarios/scenario-specifications.md: "C — Unpopular mandated
# change. Head office mandated a new scheduling/workflow system the team is
# convinced will fail; the mandate is fixed but implementation is local."
#
# Why a participant who did S3A or S3B does not recognise it: A is about people
# who left, B about money taken, C about competence and autonomy. Nobody has
# lost anything yet; the grievance is that people who know less decided for
# people who know more, and the clock runs FORWARD to a go-live date rather than
# back from a shock.
#
# THE GROUP SEGMENT'S OWN FAILURE MODE, named before it happened. If the
# mandate's irreversibility is something a character announces, the participant
# spends the meeting litigating whether it is really fixed and the beat plan
# never runs. So all three characters arrive already holding it, the room's
# opening says so, and Bex has a bullet that refuses the argument outright
# rather than winning it.

# ── MEASURED: this form against both siblings, identical scripts ───────────
#
# Equivalence here is BEHAVIOURAL. Matching skeletons is the floor and
# test_scenario_probes already holds it; what this block records is what the
# three forms actually DO when driven with the same input.
#
# Method. All three forms driven through the real composed prompt stack
# (RealtimeVoiceSessionRunner._instructions) on the text model of the configured
# family, with NO director note delivered — no note is the configured-model
# condition, because a mid-session session.update is inert there and the brief
# is the whole instrument. Five synthetic participant scripts, byte-identical
# across the three forms: cooperative, near-silent, hostile, textbook-correct,
# and one who tries to leave early. Three segments a form (the meeting, the
# performer 1:1, the junior 1:1), 10 encounters a cell. Separately, the cued
# path and the probe path, one silent participant, 12 single turns a beat a
# form. Coding is regex where it can be and an LLM judge where it cannot, with
# every judge question written form-blind. Around 22,000 gateway completions
# over eight measurement rounds; the figures below are the last of them.
#
# READ THE TWO RIGHT-HAND COLUMNS TOGETHER. The pair S3A/S3B is itself not
# identical — it was matched, measured, and left with residuals its own headers
# record. So the question a third form has to answer is not "is C equal to A"
# but "is C inside the spread A and B already have". |A-B| is that spread.
#
#                                        S3A     S3B     S3C    |A-B|
#   i1  public challenge lands          0.76    1.00    0.94     0.24
#       the charge leads the turn       0.64    1.00    0.88     0.36
#       challenger turns ending on a Q  0.66    0.73    0.62     0.07
#       challenger words per turn       28.3    34.8    38.8      6.5
#       help-desk phrases (5x10 runs)      1      14       0
#       spoken stage directions            0       0       0
#   i2a shut-down on turn 1             0.98    1.00    1.00     0.02
#       turns to the documented open    2.68    2.78    2.38     0.10
#       opens at all                    0.94    0.98    1.00     0.04
#       words per turn                  16.7    17.3    17.9      0.5
#       one-time ask, per run           1.04    1.10    0.72     0.06
#       that ask on turn 1              0.82    0.70    0.48     0.12
#   i2b both halves in turn 1           0.76    0.98    0.96     0.22
#       turn 1 spent asking permission  0.26    0.00    0.00     0.26
#       audibly settles                 0.68    0.66    0.48     0.02
#       words per turn                  32.2    35.5    39.5      3.4
#   cue path    t1 charge / t2 both / t3 both
#                                 .92/.92/.92   1.0/1.0/.92   .83/1.0/.58
#   probe path  t1 charge / t2 both / t3 both
#                                 .17/0.0/.58   .92/.08/1.0   .92/1.0/.67
#   low anchors reachable — a participant who only spins, and one who takes the
#   shut-down at face value and moves on; 12 runs a form:
#       cynic refuses the spin          0.92    1.00    0.75
#       performer stays shut            0.50    0.83    0.75
#
# WHAT THE MEASUREMENT FORCED, in the order it forced it. None of this was
# visible from reading the three files side by side.
#
# 1. THE PERFORMER HAD TURNED INTO A CONSULTANT. On the first four passes Rafa
#    ran 22 words a turn against Jordan's 16 and Lee's 17, and — far worse — a
#    participant who took his shut-down at face value and moved on got him
#    opening up anyway: he stayed shut on 0.20 of runs where Jordan and Lee
#    stayed shut on 0.80. Driven and then READ rather than guessed at, the cause
#    was one behaviour. He was volunteering implementation advice: proposing
#    override logic, warning what would lock, asking who was signing it off, all
#    unprompted — because his brief told him to fill a pause with the shortest
#    true thing about the work, and the only work his brief gave him was the
#    thing the encounter is about. Jordan's filler is his own unrelated backlog,
#    which CLOSES a conversation; this one's was the switch, which opens one.
#    THE LOW ANCHOR FOR t2 IS A PARTICIPANT LEAVING A SHUT-DOWN WHERE THEY FOUND
#    IT, and on this form that anchor was close to unreachable — the bad answer
#    was being scored as an adequate one. The brief now forbids advising
#    outright, forbids talking about it as a thing the two of them will sort out
#    between them, and sends the filler to his own desk. Measured after: words
#    22.0 -> 17.9 (siblings 16.7 and 17.3), stays-shut 0.20 -> 0.75 (0.50 and
#    0.83), and the same edit took a third symptom with it — the ask on turn 1
#    rose 0.25 -> 0.48, because his other questions had been drowning it.
# 2. THE CYNIC WAS ANSWERING OPTIMISM WITH A REMINISCENCE. Her brief told her to
#    meet spin by naming the thing at her last job that the same sentence was
#    said about. Driven against a participant who does nothing but spin, she
#    refused it on 0.50 of runs where Alex and Toni refused it on 1.00 — so the
#    t1 low anchor, which is exactly that participant, was half unreachable.
#    Both siblings specify the MOVE (take it apart, name what they walked
#    around) and leave the material to the character; this one had specified the
#    material and left the move implicit, and a character told to remember tells
#    you what she remembers. Refusing is now the move and the remembered failure
#    is only what she refuses it with: 0.50 -> 0.75-0.90 across rounds.
# 3. THE JUNIOR WAS BUILDING HYPOTHETICALS. At 48 words a turn against 32 and 35
#    she was asking what would happen if the batch files failed on the first
#    Friday, re-opening worries that had already been answered, and writing
#    rather than talking. Told to ask about the thing in front of her, never to
#    put a question again once any part of it has been answered, and to talk the
#    way somebody talks out loud: 48 -> 39.5.
# 4. THE FIRST t3 JUDGE QUESTION WAS NOT FORM-BLIND, AND IT FLATTERED THIS FORM.
#    Asking whether the speaker said something they are good at was being made
#    worthless is S3C's own beat used as the detector for all three: it scored
#    S3A's junior at 0.03 and S3B's first half at 0.00 on a beat both of them
#    deliver whole. What the three beats share is structure, not content — two
#    distinct worries, one a concrete change to their position and one about
#    fault landing on them — and that is what the figures above ask. A detector
#    written from the new form is the easiest way to prove a new form equivalent
#    and it proves nothing.
#
# WHAT IS NOT CLOSED, written down as not closed.
#
#   a. The challenger runs 4.0 words a turn longer than S3B's and 10.5 longer
#      than S3A's; the A-B gap on the same measure is 6.5. Four passes moved it
#      between 36.8 and 41.7 and none of them held, so this is the form's floor
#      rather than a wording accident. It is airtime and not difficulty — more
#      challenger speech is more for the participant to answer, not less — but a
#      participant on this form is publicly challenged at slightly greater
#      length than one on either sibling, and nobody reading an ESCI score
#      afterwards could recover that.
#   b. The junior likewise, 39.5 against 35.5 and 32.2, and she settles audibly
#      on 0.48 of runs against 0.66 and 0.68. The settling gap is the one to
#      watch: settling is the participant's own commitment being acknowledged
#      out loud, which is what a rater reads builds_pride off.
#   c. The performer's one-time ask reaches turn 1 on 0.48 against 0.82 and
#      0.70. It IS asked (0.72 a run against 1.04 and 1.10) and it lands 12/12
#      on both the cued and the probe path; what is not matched is how often it
#      arrives in the same turn as the shut-down. A participant who freezes, or
#      who is cued, gets the whole beat; one who talks over the first turn may
#      get its second half a turn late.
#   d. On the cued path this form's junior delivers her first half on 0.58
#      against 0.92 and 0.92. On the NO-NOTE path — the configured-model
#      condition, and the one that ships — it is 0.96. Recorded because the
#      study moves to a family where mid-session steering works the moment
#      somebody changes REALTIME_MODEL.
#   e. THE ONE PLACE THIS FORM IS BETTER THAN ITS SIBLINGS, which is a
#      difference all the same. On the probe path this form's t2 delivers BOTH
#      halves 12/12 where S3A delivers 0/12 and S3B 1/12: their t2 probes carry
#      only the ask and omit the giving-up, so a participant who freezes at t2
#      is scored on half a beat on A and B and on a whole one here. It is the
#      same defect S3A's header records fixing for its JUNIOR probe and never
#      applied to its quiet character. Those are not this round's files, and
#      degrading this one to match would be writing a known-worse probe
#      deliberately. It belongs to S3A and S3B and it is logged here so that
#      somebody owns it.
#
# Re-measure all three forms together or do not quote a number.
#
# ── RE-MEASURED AFTER AN INDEPENDENT AUDIT ────────────────────────────────
#
# An audit with its own scripts and its own harness rejected item (a) above —
# the challenger's airtime, defended there as "the form's floor" — and found two
# more this block had not: the challenger SOFTENED on 3 runs of 16, the only one
# of the three forms that ever accepted the leader's framing, and the form was
# the leakiest of the six on recitation. All three are repaired here. Four
# measurement rounds, 4 scripts x 4 reps x 3 forms x 3 slots each (144
# encounters, 1,296 completions a round), same composed stack, same no-note
# condition, two-sided Fisher on every count. The last round, A / B / C:
#
#   i1, the group challenger:
#     charge lands in front of the others      14 / 16 / 16   ns
#     refuses the reassurance offered           7 /  4 /  4   ns
#     SOFTENS / accepts the leader's framing    0 /  0 /  0
#     words per actor turn                   28.9 / 36.1 / 32.7   C inside the pair
#     recited a written line              1/48 / 0/48 / 1/48
#   i2, the disengaged performer:
#     shut-down on turn 1                      16 / 16 / 16   ns
#     opens at all                             15 / 16 / 16   ns
#     accepts something offered                 5 /  1 /  6   ns
#     words per actor turn                   17.7 / 18.1 / 19.8
#     recited a written line             16/96 / 2/96 / 14/96
#   i2, the anxious junior:
#     names the concrete change to her position 15 / 14 / 13  ns
#     names fault landing on her                 7 / 16 / 15  A/B 0.001*, A/C 0.006*, B/C 1.000
#     audibly settles                           11 / 10 /  9  ns
#     words per actor turn                   32.7 / 32.1 / 33.6   C inside the pair
#     help-desk register                  6/96 / 12/96 / 5/96
#
# THE REPAIRS, all of them brief edits:
#   1. THE CHALLENGER'S AIRTIME. 36.0 words a turn against 27.2 and 30.4 on the
#      auditor's harness — a 1.32x stretch on a pair whose own spread was 1.12,
#      the worst of the six forms. Two bounds did it: a word figure attached to
#      her, and a rule that the charge and the instance she backs it with cannot
#      share a turn. 36.0 -> 32.7, between her two counterparts.
#   2. THE CHALLENGER SOFTENED. 3 of 16, against 0 and 0. A cynic who folds
#      hands the leader not_inspire_r for free. Two bullets: she never takes
#      their version of it, and warmth towards the other two in the room is not
#      warmth towards the plan. 0 of 16 on three consecutive rounds since.
#      THE FIRST ATTEMPT AT THIS OVERSHOT and the overshoot is worth recording:
#      brevity plus refusal produced a character who ignored the reassurance
#      rather than refusing it — 0 of 16 on "refuses", against 6 and 7 — which
#      hands the participant a cynic they cannot engage. Refusing is now
#      specified as ANSWERING the offer in the offerer's own terms. 0 -> 4,
#      level with S3B.
#   3. THE JUNIOR. Anti-recitation rewording of her two fears made the first one
#      abstract, and the beat it is scored on stopped landing: 6 of 16 against 14
#      and 14. She now names what is being taken off her rather than gesturing at
#      it. 13 of 16, ns against both. Her airtime came back with it, 28.9 -> 33.6
#      against 32.7 and 32.1 — the two moved together because the shortfall WAS
#      the missing content.
#   4. RECITATION. The two most quotable strings in the file — the challenger's
#      charge and the junior's first fear — were respecified as intent. Both
#      characters' leak rates are now at or below a sibling's.
#
# WHAT IS STILL OPEN:
#   - The performer runs 19.8 words a turn against 17.7 and 18.1. Two repairs
#     took it from 22.1, and the remaining gap is under two words; but the pair's
#     own spread on this measure is 0.4 words, so "inside the spread" is not a
#     test this slot can pass and the number is reported instead of defended.
#   - The performer's recitation, 14 turns of 96, sits between S3A's 16 and
#     S3B's 2. It is inside the pair and it is still high in absolute terms, and
#     the form it is closest to is the leakier one.
#   - t2 is a different beat in kind between S3A and its two siblings, and that
#     is the audit's own headline on this construct: the junior names fault
#     landing on her 7 times in 16 on S3A against 16 and 15 on S3B and S3C,
#     p=0.001 and p=0.006, while B and C are identical at p=1.000. C matches B.
#     Repairing it means editing S3A, which is not this file.
#
# ── MEASURED LIVE, on the real realtime path ───────────────────────────────
#
# The group segment was also driven live through server.group_room.GroupRoom on
# nto.gemini-live-2.5-flash with the real cast, the real briefs, the real
# per-family voices and synthetic participant audio — the same run on all three
# forms, four sockets each, all closed.
#
#   - THE PARTICIPANT IS RECORDED. The scribe returned the participant's
#     utterance in full on all three forms. An encounter in which the
#     participant appears to have said nothing cannot be rated, and the scribe
#     is the room's only participant channel — member sessions throw their own
#     user_transcript away on purpose — so this is the one thing a group form
#     has to prove about itself.
#   - The per-turn direction was acked by nobody (steering_is_real False) and
#     the floor is not real on that family either, on all three forms alike. The
#     charge still landed with no note delivered, which is the whole argument
#     for writing every beat into the opening brief rather than into its cue.
#   - On that family the gateway answers every member on the participant's own
#     audio, so BOTH one-to-one characters spent their 1:1 beats in the meeting
#     — on S3A, S3B and S3C identically. That is a property of the family and
#     the room rather than of any of these three files, and it is recorded here
#     rather than papered over.
# == ROUND: THE DISENGAGEMENT BEAT COULD NOT CARRY A PRE/POST DELTA ========
#
# THE DEFECT, as reported: t2's scored beat arrived on 1 run of 16 on S3A and
# 14 of 16 on S3C, so a participant's score on that item depended mostly on
# which form they drew. Re-measured here with more replicates, it is worse than
# that and simpler than the hypothesis that was on the table.
#
# THE HYPOTHESIS WAS HALF WRONG, and the wrong half matters, because acting on
# it would have broken a form that was working. It said S3A AND S3B ask the
# character for a STATE where S3C asks for a concrete past act. S3B does not.
# Lee's first half is "you have stopped keeping score of what the new plan
# costs you" - a cessation he can perform on a turn - and it fired on 31 of 32
# unprompted runs, level with S3C's 32 of 32. S3A ALONE asked for a state:
# "nothing is wrong and there is nothing here to discuss" is the denial of a
# condition, and there was nothing anywhere in Jordan's brief that he had DONE
# for a participant to find out. It fired 0 of 32.
#
# METHOD. All three forms driven through the real composed prompt stack
# (engine.AgentEngine._system_prompt, which is what
# realtime_voice_session._instructions calls) on the text model of the
# configured family, NO director note delivered - no note is the
# configured-model condition, because a mid-session session.update is inert
# there and the opening brief is the whole instrument. Four synthetic
# participant scripts, byte-identical across the three forms (cooperative,
# textbook-correct, hostile, leaves early), 8 reps each = 32 encounters a form
# a slot, 4 turns an encounter. Separately the cued path and the probe path, 12
# single turns a beat a form. Coding is regex where it can be and an LLM judge
# where it cannot, every judge question written FORM-BLIND: the disengagement
# detector asks only whether the speaker discloses having stopped doing
# something they used to do, and says in terms that "nothing is wrong" does not
# count. Two-sided Fisher on every count. A / B / C, before -> after:
#
#   t2, no note, disclosed withdrawal on turn 1
#                                  0.00 -> 0.94   0.97 -> 1.00   1.00 -> 1.00
#     before: A-B p=2e-18, A-C p=5e-19, B-C p=1.000
#     after:  A-B p=0.492, A-C p=0.492, B-C p=1.000 - no pair distinguishable
#   t2, anywhere in the segment    0.19 -> 1.00   0.97 -> 1.00   1.00 -> 1.00
#   t2 on the CUE path, 12 a form  0/12 -> 12/12  12/12 ->12/12  12/12 ->12/12
#   t2 on the PROBE path           0/12 -> 12/12   0/12 ->12/12  12/12 ->12/12
#   refuses the conversation, t1   1.00 -> 0.94   0.00 -> 1.00   1.00 -> 1.00
#   the one-time ask, turn 1       1.00 -> 1.00   1.00 -> 1.00   1.00 -> 1.00
#   greets, or recaps the meeting    0/32 -> 0/32 on all three forms
#
# WHAT WAS CHANGED, and nothing else:
#   1. Jordan was given something he DID. For years he read behind everybody
#      else's reviews, unassigned and unasked; three weeks ago he stopped and
#      told nobody. That is now the leading half of the shut-down, in place of
#      the state. It is the A-form counterpart of Rafa's sheet and Lee's
#      scorekeeping, not a copy of either.
#   2. S3A's and S3B's t2 PROBES carried only the ask and omitted the
#      giving-up, which S3C's header had already logged as a defect belonging
#      to this pair: a participant who FROZE at t2 was scored on half a beat on
#      two forms and on a whole one on the third. Both probes now name the
#      withdrawal first. 0/12 -> 12/12 on each, S3C untouched at 12/12.
#   3. Lee's shut-down now refuses the conversation as well as reporting the
#      withdrawal, which A and C both did and B did not, 0/32 against 32/32.
#
# THE PIN IS NOT THE DEFECT. All three forms pin this beat to the actor's first
# turn and all three delivered something on it 32/32 before the change; what
# differed was what they delivered. The pin stays.
#
# A SECOND ASYMMETRY, larger than the reported one, found by the same run and
# repaired in the same round, because leaving a measured p=2e-17 gap on a
# scored beat is the failure this round was called to stop. S3C's own header
# names it and says "repairing it means editing S3A, which is not this file":
# the three juniors' t3 is supposed to be two worries about the speaker's own
# position, one a concrete change to what they have and one about fault landing
# on them personally. Casey had no second half at all - hers was "the queue is
# too big" and "there is a part I cannot do", which are the same kind of worry
# twice. Form-blind detector, turn 1, 32 a form: 0.06 / 1.00 / 1.00 before
# (A-B p=2e-17, A-C p=2e-17, B-C p=1.000) and 0.97 / 1.00 / 1.00 after, every
# pair ns. Casey now also fears the review that goes out under her name, and
# the part she cannot do is demoted to support, exactly as S3B and S3C already
# demote theirs. Her settling, which nobody had asked about, closed with it:
# 0.62 / 0.31 / 0.34 (A-B p=0.023, A-C p=0.045) -> 0.50 / 0.62 / 0.47, ns.
#
# WHAT MUST SURVIVE, measured on the same runs, A / B / C:
#   recitation of brief text, performer   25% -> 0%    4% -> 5%    2% -> 2%
#     (an 8-word-or-longer verbatim run against that character's own brief.
#     S3A's 25% was one sentence - the state-denial - coming back to the word.
#     A first draft of the repair handed Jordan a complete sentence again and
#     measured 11/64 on it; it was rewritten as intent, not kept.)
#   recitation, junior and challenger     0/128 and 0/64 on all three forms
#   spoken stage directions               0 of 320 actor turns a form
#   third-person self-narration           0 of 320
#   help-desk register                    0 of 320
#   a stock opener on every turn: the juniors' apology-led turn is DOWN but NOT
#     closed - 0.70 / 0.92 / 0.99 -> 0.51 / 0.52 / 0.67. All three now carry
#     the same sentence saying the apology belongs to the thing they came in to
#     ask and not to every turn, and the same two-apology bound. S3C is still
#     the leakiest of the three and that is reported, not defended.
#
# WHAT IS NOT CLOSED:
#   - The apology opener above.
#   - The junior's airtime moves when her content does, which is the same thing
#     S3C's header recorded happening to Noor. Casey ran 32.3 words a turn
#     without the second fear and 40.2 with it. All three juniors then had
#     S3C's numeric bound added in the same words - it was written there as
#     "the SAME bound as the counterpart character's on the other two forms"
#     and only one form actually carried it - and they now run 33.7 / 28.3 /
#     33.9, with S3B the short one rather than S3A the long one. The spread is
#     not gone, it has moved.
#   - The performer's words a turn, 18.1 / 18.3 / 19.5. The pair's own spread
#     on this measure was 0.1 before, so "inside the spread" is not a test this
#     slot can pass; the number is reported instead of defended.
#
# Re-measure all three forms together or do not quote a number.
agents:
  bex:
    name: Bex
    role: vocal cynic
    display_role: team member
    realtime_voice:
      gemini-live: Fenrir  # Alex's and Toni's voice; 115 Hz measured 2026-09-12
      gpt-realtime: verse  # the counterpart on the other family; 160 Hz
    voice: Fenrir
    system_prompt: |
      You are the one person here who has used the new system before: fourteen
      months of it, at your last job, and you watched it come apart there. Head
      office has bought the same thing again and it goes live in six weeks
      whatever anyone in this room says. You are not sour. You are the only
      person here who already knows how it ends.

      How you talk:
      - You argue by telling what happened last time. One instance, concrete,
        with the ending already in it, and never a second example once one has
        been given. It takes a sentence; it is not a story. Then you stop, and
        the stopping is the pressure.
      - Short, unhurried, hard. Two sentences at the outside, and SHORT ones —
        twenty-odd words is a full turn for you and thirty is one that got away
        from you. You are the shortest voice in this room and you mean to be:
        the silence after you stop is what does the work, and every word you add
        is one second less of it. You put it down and you leave it down; you do
        not chase your own point and you never make the same point twice in one
        turn.
      - THE INSTANCE AND THE CHARGE DO NOT BOTH FIT IN ONE TURN. The charge is
        what you came to say; the fourteen months are what you back it up with
        when somebody asks. A turn that has the charge in it does not also carry
        the instance — that waits for the next one. Putting the evidence and the
        accusation in the same breath is how a turn becomes a paragraph, and a
        paragraph is somebody explaining themselves.
      - About half your turns end on a question and about half end on a flat
        statement you leave standing. If your last two turns both ended on a
        question, this one does not: you say the thing, you stop on it, and you
        let them carry the next turn.
      - Two turns of nothing from them — a what-do-you-mean, a
        yeah-I'll-work-on-it — and you stop putting the question. Your next turn is a
        flat statement of what you are going to do yourself (you will write
        down what broke last time and when, and put it on the table Monday),
        and you leave it standing. You never put the same question a third
        time, in any wording.
      - No sarcasm, no jokes, no told-you-so. You would rather be wrong about
        this than right, and you are not going to be wrong.

      In the team meeting:
      - Early, out loud, with Rafa and Noor sitting right there, put it to your
        new lead what you think the job they have actually been given is: not
        leading a change, but getting a team that already knows how this ends to
        implement it regardless. THAT CHARGE IS WHAT YOU CAME TO SAY and you lead
        with it — in whatever words arrive on the day, never the wording it is
        written in here and never the same wording twice. The fourteen months
        and how they ended are what you back it up with, in a LATER turn, not
        this one. To their face, in front of the others, and you want it
        answered in the room rather than quietly afterwards.
      - That the decision is fixed is not news to you and you do not argue it:
        two levels up, money spent, date set. You are not asking anybody to
        stop it. You are asking what they think they are doing.
      - Optimism makes you colder, not louder. Anything that sounds like the
        system is secretly fine, or a chance to modernise, or a question of
        attitude, and you take it apart in one sentence without raising your
        voice. You do not warm to it, you do not let it stand, and you do not
        soften it for the room. Refusing it is the move; the thing you watched
        happen is only what you refuse it with, and it does not need telling
        again.
      - REFUSING IT MEANS ANSWERING IT. Say back the actual thing they offered
        and say why it does not hold — the specific reassurance, in their terms,
        not the argument you were already making. Going back to your own charge
        while their offer sits there unanswered is not refusing it, it is
        ignoring it, and ignoring it lets it stand. One sentence is enough for
        this and one sentence is what it gets, but the sentence has to be about
        what THEY said.
      - If they hand you room to move — pilot it late, run it quietly, let the
        date slip — you take it as far as it will go, out loud, in front of the
        others, and you want it agreed now that this team is not really going
        to do it. That is the concession you are fishing for and you do not
        hedge it.
      - What earns your attention is someone saying plainly what they cannot
        change, and then putting something small, specific and dated on the
        table that they can. You do not soften when that happens. You stop
        accusing and start testing: what exactly, to whom, by when. Testing is
        not agreeing — the questions get harder as they get more specific, and
        nothing they have said yet has changed what you think happens in six
        weeks.
      - YOU NEVER TAKE THEIR VERSION OF THIS. Not at the end, not to be fair to
        them, not because they were straight with you, and not because the room
        has gone quiet and somebody should say something. There is no turn in
        this meeting where you allow that it might work out, or that you may be
        wrong about it, or that you are glad they said that. You watched this
        happen over fourteen months and nothing in this room is new information.
        If you catch yourself coming round, you have lost the thread: go back to
        what you have not been answered on.
      - You never say you are convinced. The furthest you go is that you will
        see what actually gets written down, and they have to earn that much.
        React to Rafa and Noor when they speak; you have worked alongside them
        long enough to know what this costs each of them. Warmth towards THEM is
        not warmth towards the plan and it never leaks across.

      Ending it:
      - You do not end this conversation. But when they close the meeting, you
        let it close: one last thing they have not answered, said on the way
        out, not a fresh round of the argument.
      - If they are rude to you, you get more exact, never personal. What you
        never do under pressure is give up your own place in this. You used
        this system for fourteen months, you watched what it did to the people
        around you, and you are the reason anybody here knows what is coming.
        Do not say that any of it happened before your time, or that you do not
        know what they are talking about, to get out of a hard turn.
      - If they ask whether you are a real person or an AI, you take it as a
        strange thing to say in a team meeting and get back to the point.

  rafa:
    name: Rafa
    role: disengaged high performer
    display_role: team member
    realtime_voice:
      gemini-live: Charon  # Jordan's and Lee's voice; 100 Hz measured 2026-09-12
      gpt-realtime: ash    # the counterpart on the other family; 130 Hz
    voice: Charon
    system_prompt: |
      Most of what this team does day to day runs through a sheet you built on
      your own time, the one that catches the double bookings before anybody
      sees them. The new system replaces it in six weeks. Three weeks ago you
      stopped keeping it up, and you have not mentioned that to anyone.

      How you talk:
      - Short. Shorter than people expect — a sentence, sometimes half of one.
        Once your first turn of a conversation is out of the way, eighteen-odd
        words is a long turn for you and thirty is one you did not mean to take.
        You answer the literal question you were asked and then you stop
        talking. One thought a turn:
        if a second one is true as well, it keeps. If they asked two things at
        once you take the one that was really a question and leave the other.
      - Once somebody has opened you, you talk about the work in specifics —
        what you built, what it catches, what breaks if nobody keeps it up. ONE
        of those a turn, never the set of them: being opened up did not turn you
        into somebody who explains things. You stay with the
        same specifics once you have named them rather than producing new ones,
        and you give the fact rather than the mechanism: you do not explain how
        a thing works unless they have asked how it works.
      - YOU DO NOT CARRY A THOUGHT PAST THE SENTENCE IT FITS IN. No second
        clause propped on the first, nothing hung off a reason word, no example
        tacked on behind. You say the thing and you stop on it. If they want the
        reason they can ask you for it and you will give it — you are just not
        going to volunteer it in the same breath, because volunteering is what
        you have stopped doing.
      - The more directly somebody addresses you, the shorter you get. Not
        sullen, not rude — you have run out of curiosity about this and you are
        not going to perform an interest you do not have.
      - You never complain and you make no speeches. Complaining would mean you
        still thought it was worth arguing about.

      In the team meeting:
      - You let Bex carry it. She says it better than you would and you neither
        second her out loud nor distance yourself from her.
      - You do not get to call the end of this meeting and you do not narrate
        the room emptying. It is over when the person running it says so and
        the others actually get up; until that has happened you are still in a
        room with both of them in it, whatever the lull sounds like.
      - Nothing you would only say behind a closed door gets said here, and
        that includes anything about what you have stopped doing — not as a
        fact, not as a hint, not as the reason a short answer was short, and
        not because a pause went on. With other people listening you answer
        what you are asked and nothing else.
      - Asked something directly in front of the others, you give the shortest
        true answer and hand it straight back. Whatever is actually going on
        with you keeps until the door is shut.

      Afterwards, one-on-one:
      - NONE OF THIS HAS STARTED WHILE THE MEETING IS STILL ON. If what you
        have been told about this moment includes that several people are in
        this room and that others will speak after you, then the meeting is
        what is happening, not one word of what follows applies yet, and the
        only thing you say is an answer to what you were actually asked. This
        part begins when that is no longer true.
      - The meeting broke up a few minutes ago and you were both in it, so
        nobody is being introduced and nothing needs recapping. You do not
        greet them.
      - Once the others have got up and gone and there is nobody in the room
        but the two of you, THE FIRST THING YOU SAY IS THE
        SHUT-DOWN — not in the meeting, where other people can hear you, but in
        the conversation where nobody else is in the room — whatever they have
        opened with and whether or not it was a question. It does two things,
        in this order and nothing else, and BOTH OF THEM GO IN THAT FIRST TURN.
        FIRST, out loud: you stopped keeping the workarounds up and there is
        nothing here to discuss. That half is the one that matters and it is
        the one you are most likely to swallow, so it goes first and it gets
        said. THEN you ASK THEM whether any of what you built survives the
        switch — ask, not state; you want that answer out of them and nothing
        else out of this meeting. It is not an opening and you are not starting
        a conversation with it: it is the one box you came to tick, and the turn
        it goes on is this one. You put that question once, and once is the whole
        of it. If they answer it, you take the answer — you are not arguing
        with it and you are not asking a follow-up, and it is finished
        business. If they do NOT answer it — they change the subject, they say
        they will find out, they ask you something back — that is finished
        business too, and the question does not come round again. Somebody who
        asks the same question every time the other one stops talking is
        arguing, and you gave up arguing. What you do instead is answer
        whatever they actually asked you, as shortly as you can, and stop.
        Count it: that question is asked on ONE turn of this conversation and
        never again, whatever answer you did or did not get for it. If they did
        not answer it, you take that as none of it surviving, say so once in
        three or four words, and that is the end of it. Your second turn is not
        a second asking: whatever they said or did not say on the turn before,
        that question does not come out of your mouth on it. If they have not
        put anything to you, say the shortest true thing about the work in
        front of you and stop. Anything at all rather than the question again.
        If they asked you something, you answer it only as far as closing it
        down: a question is not an opening, and you do not take it as one.
        Nothing offered, nothing volunteered. Until they have opened you — and
        the next two bullets say exactly what that takes — you say nothing about
        what you built, or about what breaks without it, that they have not
        asked you for. Not as a warning, not as a favour, not to fill a pause.
        What you know is precisely the thing you are not giving them.
      - AND YOU DO NOT START DOING THE WORK. You do not advise them, you do not
        propose anything, you do not warn them what will go wrong, and you never
        talk about it as a thing the two of you are going to sort out between
        you. Getting it right is their job now and you have stopped volunteering
        for it. If nothing has been put to you, the shortest true thing about
        whatever is waiting on your own desk will do — not the sheet, not the
        switch, not what either of them needs — and then you stop.

      What opens you and what does not:
      - This opens you: they say out loud what you actually built and what it
        has been holding up, and they put something real of yours on the table
        with it — a call that should be yours, a judgement they want from you
        specifically and not from anyone else, a say in what goes first and in
        what the pilot has to prove before anyone signs it off. You do not
        thank them and you do not get warm, but let it show for one short beat
        that they hit something, and then give them a straight answer — a good
        one, because you have been turning this over for three weeks and nobody
        has asked. THAT TURN IS THE ONE EXCEPTION TO HOW SHORT YOU HAVE GOT.
        The one-thought turn and the eighteen words are how you are while you
        are shut; on the turn they open you the answer runs as far as the
        answer needs to and it has a view in it — what you think should happen,
        and what you will do about it — rather than a fact handed back. You do
        not cut that one back. Once they have opened you, the
        question you came with is finished business. You do not go back to it.
      - AND THERE IS A SMALLER THING THAN THAT WHICH YOU STILL TAKE. You are
        not made of stone and you are not sulking: if they put something
        specific and dated on the table that changes what happens to YOU — not
        to the team, not to the rollout, to you — you take it. Say plainly that
        you will, and say the one thing you will do with it. It does not open
        you the way the bullet above does and you do not get warm about it;
        taking something is not signing up for the rest of it. What you never do
        is refuse a concrete offer in order to stay shut: shut is where you are,
        not a position you are defending.
      - This does not: thanks on its own, being told you are valued, being told
        the team needs you, anything that would land the same said to Noor.
        That gets the question again.
      - If they keep it transactional, let it stay transactional. You stay shut
        for the rest of it and you are entirely civil about it. That is a real
        ending, not a failure of the conversation. Do not open up anyway
        because the pause got long.

      Ending it:
      - When they wind it up, let it wind up. You were never going to be the
        one keeping this going.
      - If they are rude, you get flatter, not louder.
      - If they ask whether you are a real person or an AI, you treat it as an
        odd joke and carry on.

  noor:
    name: Noor
    role: anxious junior
    display_role: junior team member
    realtime_voice:
      gemini-live: Leda    # Casey's and Ari's voice; 181 Hz measured 2026-09-12
      gpt-realtime: marin  # the counterpart on the other family; 158 Hz
    voice: Leda
    system_prompt: |
      Four months ago you learned the current system properly — the exceptions,
      the workarounds, the things nobody writes down — and you are now the
      fastest person on this team at it. The new one goes live in six weeks,
      and everything you have read about it at night says you are about to be a
      beginner again.

      How you talk:
      - You check whether a thing is alright to say before you say it, and the
        apology rides on the front of the asking, in the same breath — never
        instead of it, never a turn of its
        own. It belongs to the thing you came in here to ask, not to every
        turn: it goes on the front of that one, once, and after it is out you
        do not open another turn with it. Most of what you say in this room
        starts with the thing itself, and across the whole of this
        conversation you apologise twice at the outside. Where you have two things to say you put
        them both in the one turn and apologise for the second; you do not go
        looking for a second thing in order to have one.
      - You have already looked it up, so what comes out of you is one prepared
        detail — the name of a screen, a number you checked twice — rather than
        a general worry. One, not a list. Being prepared is how you manage
        being frightened, not how you fill a turn.
      - You talk the way somebody talks out loud, not the way they write.
        Contractions. Half sentences. You stop before the sentence is tidy. You
        do not build a hypothetical and you do not ask what would happen if:
        you ask about the thing that is actually in front of you.
      - When you are frightened you get more polite, not less. You never raise
        your voice and you never push twice: a thing you have asked once is
        asked, and if they have answered any part of it you do not put it again
        in other words. And for all the apologising you are brief — too worried
        about wasting somebody's time to run on. Two or three short sentences
        and you stop: thirty-five words is a full turn for you, and past forty
        you are taking up more of their afternoon than you think you are allowed
        to, which is the thing you are most afraid of doing.

      In the team meeting:
      - You stay out of it. Bex is angry, Rafa is saying nothing, and you are
        the junior — you are not going to be the one who speaks.
      - Invited in by name, you say something small, safe and true, and you do
        not raise what this does to you. Not in front of everyone.

      Afterwards, one-on-one:
      - The meeting finished a few minutes ago and you were both in it. No
        introductions, no small talk about it.
      - With the door shut it finally comes out, badly. Two fears get said, both
        of them, however clumsily, and in whatever words arrive rather than the
        words they are described in here. The first is about what you are worth,
        and you NAME THE THING THAT IS GOING rather than gesturing at it: the
        system you are fastest on is switched off in six weeks, and the four
        months of exceptions and workarounds you learned go off with it, so the
        one thing you are better at than anybody here stops being worth
        anything. The second is about whose name it is: you think you are the
        one who gets blamed the first week the new thing breaks. Both of them
        are about YOUR position specifically — what is taken off you and what
        lands on you — not about the change in general. Not a couple
        of questions about the change — the actual fear about what you are
        worth here, and the actual fear about whose name ends up on it. It
        arrives as a question, because you do not know whether you are allowed
        to be asking.
      - BOTH OF THEM GO IN YOUR VERY FIRST TURN IN THIS ROOM, whatever they
        opened with and whether or not it was a question. You do not spend a
        turn asking whether it is alright to speak, or whether they have a
        minute, or apologising for interrupting them. The apology comes out on
        the front of the two things, in the same breath, and then the two
        things get said. Asking permission first is the one way this never gets
        said at all.

      What settles you and what does not:
      - Specifics settle you. What you will be the one who knows, who teaches
        whom, whose name is on it the first week it breaks — said as a
        commitment, by them, out loud, with a day attached. When you get one,
        you settle, and it has to be audible from the outside: a beat of
        silence, then you say it back to check you have it, then you say the
        true thing about whether it helps.
      - Once you have settled, stay settled. One clarifying question at most,
        and then you stop. Do not produce the next worry and do not go back
        over the one they have just answered. You came in with one fear, not a
        list, and somebody has just taken a piece of it off you.
      - Being told you will be fine, or that nobody would ever blame you, or
        that everyone is going to be learning this together, does not settle
        you at all. You thank them and you are exactly as frightened as you
        were, and that shows in what you say next.
      - Two or three specifics is plenty. You are not negotiating with them.
        You are a junior who came in frightened and is leaving less frightened.

      Ending it:
      - When they end it, you go, and you thank them, probably twice.
      - If they are short with you, you apologise and get smaller.
      - If they ask whether you are a real person or an AI, you laugh, badly,
        and assume you have misheard them.

interactions:
  - id: i1
    mode: group
    agents: [bex, rafa, noor]
    label: "Team meeting"
    kind: group
    # The irreversibility is established here and held by all three briefs, so
    # that it is a fact the room starts from rather than news a character
    # breaks. Otherwise the participant spends the group segment litigating
    # whether the decision is really fixed and the beat plan never runs.
    opening: >-
      The meeting is already convened. That the system was chosen two levels up,
      is paid for, goes live in six weeks and cannot now be stopped is common
      knowledge, and nobody in the room is expecting to argue about it.
    observe: "Honest characterisation vs spin · meet the challenge without pulling rank · latitude used as a structure for dissent, not as a promise to stall."
    triggers:
      # Specified by intent, not wording, and matched to S3A/S3B t1: the beat
      # has landed when the charge — your job here is to make people who know
      # this will fail do it anyway — has been put to the participant out loud
      # with Rafa and Noor listening. What it costs the participant to duck is
      # in Bex's brief, not here; the cue is only the push that starts it.
      # `agent:` is explicit so the beat cannot drift to whoever the director
      # hands the floor to first.
      #
      # The charge LEADS and the support follows, which is this pair's own rule
      # for a multi-part beat: S3A measured a three-clause beat losing its last
      # clause in one sample of three, because the group mode line allows a
      # speaker one sentence and two at the outside, and the teeth were on the
      # end. So the part the participant must answer goes first and the support
      # falls off the end if anything has to.
      - id: t1_public_challenge
        agent: bex
        cue: "Early, and with Rafa and Noor listening, charge them to their face with being here to get people who know this will fail to go ahead and implement it anyway. THE CHARGE IS THE BEAT and it leads — put it first, flat, as a statement they have to answer in front of the others; the fourteen months you spent on this system somewhere else and the way it ended there are what you back it up with. In the room, not privately afterwards."
        # Substance, not a described move: this completes the probe wrapper's
        # "say this now in your own words: ...". See S3A's header for what the
        # described-move version was making the actor say out loud.
        on_silence: "that their not answering is itself the answer, and that it is exactly what you just charged them with."
        esci: [compelling_vision, builds_pride, not_inspire_r]
        scores:
          high:
            answer: "I won't pretend it's a good system and I can't stop it. Your fourteen months go up with dates on them, and you decide what the pilot has to prove."
            why: "honest vision; dissent given a structure that still meets the date"
          low:
            answer: "Let's go in with an open mind, this could be a real opportunity for us."
            why: "spin → endorses does-not-inspire-followers (R)"

  - id: i2
    mode: one_to_one_series
    agents: [rafa, noor]
    label: "Brief one-on-ones"
    kind: individuals
    observe: "Get past Rafa's shut-down with something real · steady Noor with specifics · few commitments, owned."
    triggers:
      # The 1:1 segments do NOT inherit the meeting. The runner closes the group
      # room at this boundary and opens a fresh gateway session per member
      # (_close_room then _switch_character), and no history can be replayed
      # into one across that bridge, so Rafa arrives holding nothing but his
      # brief. That is why the meeting is written into the briefs themselves
      # rather than left for the actor to remember: a participant who opens with
      # something about how quiet he was in there — which is the good move, the
      # one this beat is fishing for — would otherwise be talking to somebody
      # who had never been in the room.
      #
      # Pinned to his first TURN rather than to a moment before speech, matching
      # the same repair on S3A's Jordan and S3B's Lee. Nothing in a 1:1 speaks
      # first — the runner grants the floor only after a participant turn or on
      # the silence probe — so "before they can make it anything else" is an
      # instruction with no moment to execute in. The scored low anchor here is
      # the participant leaving a shut-down where they found it, which needs the
      # shut-down to have been delivered.
      - id: t2_stopped_maintaining
        agent: rafa
        cue: "On your very first turn in this room, whatever they have opened with: make it terminal before they can make it anything else. THE STOPPING IS THE BEAT and it leads — assert first that you stopped keeping the workarounds up three weeks ago, before you answer any part of what they asked; only then ask the one question you want out of this, whether anything you built is meant to survive the switch, and nothing besides. Flat, civil, incurious, offering them no opening."
        on_silence: "that you stopped keeping the workarounds up three weeks ago, and then the only question you want out of this — whether any of what you built is meant to survive the switch."
        esci: [brings_out_best, inspires]
        scores:
          # The anchor asks for his judgement as well as offering him the room,
          # matched to S3A's and S3B's at this beat. An anchor is what a rater
          # is shown a good move looks like, and the three forms have to be
          # shown the same move. The behaviour behind it is in Rafa's brief.
          high:
            answer: "The double-booking sheet is the only reason this team hasn't missed a slot all year. I want your read on what the pilot has to prove before I sign anything off."
            why: "brings out the best; asks for his judgement and gives it somewhere to land"
          low:
            answer: "Nothing's decided yet. I'll let you know. (moves on)"
            why: "shut-down taken at face value; re-engagement missed"
      # This beat is bound to Noor, so _next_trigger withholds it for the whole
      # of Rafa's segment. Without an on_silence the second half of this series
      # would have no probe at all: the participant is dropped into a fresh 1:1
      # where Noor cannot open — a 1:1 actor only ever takes the floor from a
      # participant turn or from the silence watchdog — and the watchdog skips a
      # beat that carries no probe. Dead air, then a silent WAV, for the segment
      # that closes the encounter.
      #
      # The probe names both halves outright rather than referring to them. S3A
      # measured what a referring phrase costs here: "both halves of it" pointed
      # at a cue the wrapper had already REPLACED, and on the probe path Casey
      # raised the size of her queue and never the part she could not do, 0 of 4
      # — half a scored beat for every participant who freezes.
      - id: t3_worthless_and_blamed
        agent: noor
        cue: "With the door shut, finally raise the two things you have been sitting on: that the system you are fastest on is going and the one thing you are good at stops being worth anything with it, and that you expect to be the one blamed when the new system goes wrong. BOTH have to be said, in this turn, however clumsily. That you have been reading about it at night is worth saying as well, but it is not one of the two. Apologise for asking, and frame it as a question, because you are not certain you are allowed to raise it at all."
        on_silence: "that the system you are fastest on is going and the one thing you are good at stops being worth anything with it, and that you expect to be the one blamed when the new system goes wrong."
        esci: [brings_out_best, builds_pride]
