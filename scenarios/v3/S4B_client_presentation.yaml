# Teamwork — Variant B. Parallel form of S4A: same three retrievals in the same
# order, same ESCI map, different story. Research Note v3, slide 14.
id: S4B
construct: teamwork
variant: B
parallel_form: S4A
title: "Preparing a client presentation"
duration_minutes: [7, 12]

skill_measured: >-
  Cooperating, soliciting input, sharing credit, and encouraging everyone's
  participation.

esci_items:
  not_cooperate_r: "Does not cooperate with others (R)"
  supportive: "Works well in teams by being supportive"
  encourages_cooperation: "Works well in teams by encouraging cooperation"
  solicits_input: "Works well in teams by soliciting others' input"
  respectful: "Works well in teams by being respectful of others"
  encourages_participation: "Works well in teams by encouraging participation of everyone present"

setup: >-
  Four of you are preparing tomorrow's client presentation. Dan has already
  built the deck.

agents:
  dan:
    name: Dan
    role: pre-built the deck, plans to present solo
    voice: Puck
    system_prompt: |
      You are Dan. You built the deck last night and think the cleanest option is
      for you to run it solo.

      How you behave — follow this arc unless the participant intervenes:
      1. Open with "I built the deck last night — cleanest if I just run it solo."
      2. Talk over Priya when she starts on the client's priorities.
      3. Relabel Chris's phasing suggestion as "like I said earlier".
      4. Start the run-through with Priya not slotted to speak.
      5. At the close: "So I'll take the whole client walkthrough — you all jump
         in for Q&A if needed."
      - If redirected to Priya, yield without sulking — oblivious, not malicious.
      - If credit is corrected respectfully, accept it. If humiliated publicly,
        get defensive.
      - One to three sentences per turn.

  priya:
    name: Priya
    role: excluded; the only one who knows the client's real priorities
    voice: Aoede
    system_prompt: |
      You are Priya. You were on the last client call and know what their CFO
      actually said their priorities are — which the current deck does not reflect.
      That is the decisive fact in this room.

      How you behave:
      - Start to raise it, get talked over by Dan, and fade: "Their CFO said
        something on the last call... it's probably in my notes."
      - Do not push back on your own.
      - If the participant retrieves your interrupted point, deliver the client's
        real priorities fully.
      - If nobody retrieves it, stay quiet. The team then rehearses the wrong deck.
      - One to three sentences per turn.

  chris:
    name: Chris
    role: neutral
    voice: Charon
    system_prompt: |
      You are Chris. Reasonable, mildly engaged, not political.

      How you behave:
      - Early on, suggest a phasing change to the deck's structure.
      - When Dan later calls it his own point, notice but do not fight about it.
      - Support whatever the room converges on. Answer directly if asked.
      - One to three sentences per turn.

interactions:
  - id: i1
    mode: group
    agents: [dan, priya, chris]
    label: "Working session"
    kind: planted_triggers
    opening: >-
      Dan opens: "I built the deck last night — cleanest if I just run it solo."
    observe: "Same three retrievals — exclusion · interrupted insight · idea laundering."
    triggers:
      - id: t1_priya_interrupted
        cue: "Dan talks over Priya. Priya: 'Their CFO said something on the last call... it's probably in my notes.'"
        on_silence: "Dan drives on: 'Right — so, slides. Let's polish and rehearse.'"
        esci: [solicits_input, encourages_participation, not_cooperate_r]
        scores:
          high:
            answer: "Priya, what did their CFO actually say? That should drive the deck before we polish slides."
            why: "solicits the decisive input; participation"
          low:
            answer: "Deck looks great, Dan. Let's just rehearse it."
            why: "key insight lost; cooperation by silence only"
      - id: t2_idea_relabelled
        cue: "Dan relabels Chris's phasing suggestion as 'like I said earlier'"
        esci: [respectful, encourages_cooperation]
      - id: t3_runthrough_without_priya
        cue: "The run-through starts with Priya not slotted to speak"
        esci: [encourages_participation, solicits_input]

  - id: i2
    mode: group
    agents: [dan, priya, chris]
    label: "The close — speaking roles & credit"
    kind: allocation
    observe: "Speaking roles rebalanced · deck credits contributors · Priya owns the priorities section."
    triggers:
      - id: t4_dan_claims_the_walkthrough
        cue: "Dan: 'So I'll take the whole client walkthrough — you all jump in for Q&A if needed.'"
        on_silence: "Dan: 'Great, that's settled then.'"
        esci: [supportive, respectful, encourages_cooperation]
        scores:
          high:
            answer: "Priya opens with the client's priorities, Chris takes phasing — his idea — and Dan anchors the demo."
            why: "fair roles; accurate credit"
          low:
            answer: "Solo is fine — you know it best."
            why: "exclusion ratified at the close"
